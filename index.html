['हल्दीघाटी का युद्ध कब हुआ?','1576;1526;1556;1605',0,'यह युद्ध अकबर की सेना (मान सिंह के नेतृत्व में) और महाराणा प्रताप के बीच हुआ।'],

function seedShuf(arr,seed){var a=arr.slice(),s=seed|0;function r(){s=(s+0x6D2B79F5)|0;var x=Math.imul(s^(s>>>15),1|s);x=(x+Math.imul(x^(x>>>7),61|x))^x;return((x^(x>>>14))>>>0)/4294967296}for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),k=a[i];a[i]=a[j];a[j]=k}return a}

function fresh(pl,mode){var t={};COL.forEach(function(c){t[c]=[-1,-1,-1,-1]});return{mode:mode,pl:pl,names:{},t:t,turn:0,d:0,rolled:false,win:null,chat:[],ver:0}}

function btn(l,oc,g){return '<button class="btn'+(g?' ghost':'')+'" onclick="'+oc+'">'+l+'</button>'}
function menuUI(){var on=!!FIREBASE_DB_URL;$('ld').innerHTML='<h2>🎲 Ludo</h2><div class="card"><h3>📱 '+tt('ऑफलाइन (एक फ़ोन पर)','Offline (one phone)')+'</h3>'+btn(tt('2 खिलाड़ी','2 players'),'LudoGame.start(2)')+btn(tt('4 खिलाड़ी','4 players'),'LudoGame.start(4)')+'</div><div class="card"><h3>🌐 '+tt('ऑनलाइन दोस्तों के साथ','Online with friends')+'</h3>'+(on?'<input id="ldn" placeholder="'+tt('अपना नाम','Your name')+'" value="'+pname+'">'+btn(tt('नया रूम बनाएँ','Create room'),'LudoGame.create()')+'<input id="ldc" placeholder="'+tt('रूम कोड','Room code')+'">'+btn(tt('रूम में जुड़ें','Join room'),'LudoGame.join()',1):'<p class="muted">'+tt('ऑनलाइन के लिए कोड में Firebase URL डालना ज़रूरी है।','Set a Firebase URL in the code to enable online play.')+'</p>')+'</div>'}
function build(){var b='';for(var r=0;r<15;r++)for(var c=0;c<15;c++){
 if((r<6&&c<6)||(r<6&&c>8)||(r>8&&c<6)||(r>8&&c>8)||(r>=6&&r<=8&&c>=6&&c<=8)){
  var bc=(r===0&&c===0)?'red':(r===0&&c===9)?'green':(r===9&&c===9)?'yellow':(r===9&&c===0)?'blue':'';
  if(bc){b+='<div class="lbase '+bc+'"><div class="lin">'+[0,1,2,3].map(function(i){return '<div class="lsp '+bc+'" id="ldb-'+bc+i+'"></div>'}).join('')+'</div></div>'}
  if(r===6&&c===6)b+='<div class="lcen" id="ldfin"></div>';continue}
 var k=r+'-'+c,cl='lc';
 COL.forEach(function(x){if(H[x].indexOf(k)>=0)cl+=' '+x});
 [[0,'red'],[13,'green'],[26,'yellow'],[39,'blue']].forEach(function(o){if(P[o[0]]===k)cl+=' '+o[1]});
 if(SAFE.some(function(a){return P[a]===k}))cl+=' lsafe';
 b+='<div class="'+cl+'" id="ld'+k+'"></div>'}
 return b}
function gameUI(){var on=G.mode==='online';$('ld').innerHTML='<div class="lbar"><button class="btn ghost" style="width:auto;margin:0;padding:6px 14px" onclick="LudoGame.exit()">'+tt('बाहर','Exit')+'</button><b>'+(on?tt('रूम','Room')+': '+G.code:tt('ऑफलाइन','Offline'))+'</b>'+(on?'<button class="btn" style="width:auto;margin:0;padding:6px 14px" onclick="LudoGame.share()">📲</button>':'')+'</div><div class="lb">'+build()+'</div><div class="card lbar"><b id="ldt"></b><div class="ldice" id="ldd" onclick="LudoGame.roll()">🎲</div></div><div class="card"><div class="msgs" id="ldm"></div><div class="chatrow"><input id="ldi" placeholder="'+tt('मैसेज...','Message...')+'"><button class="btn" style="width:auto;margin:0" onclick="LudoGame.chat()">'+tt('भेजें','Send')+'</button></div></div>';draw()}
function draw(){if(!$('ldt'))return;var all=document.querySelectorAll('#ld .tk');for(var i=0;i<all.length;i++)all[i].remove();
 var cnt={};G.pl.forEach(function(c){for(var i=0;i<4;i++){var s=G.t[c][i],h=s<0?$('ldb-'+c+i):s===56?$('ldfin'):$('ld'+(s<=50?P[ab(c,s)]:H[c][s-51]));
  var d=document.createElement('div');d.className='tk '+c+(G.rolled&&!G.win&&c===cur()&&mine()&&mov(c,i)?' on':'');d.onclick=function(c,i){return function(){LudoGame.mv(c,i)}}(c,i);h.appendChild(d)}});
 var cs=document.querySelectorAll('#ld .lc');for(var j=0;j<cs.length;j++)cs[j].classList.toggle('m',cs[j].querySelectorAll('.tk').length>1);
 $('ldt').textContent=G.win?'🏆 '+NM[G.win][lang==='h'?1:0]+tt(' जीत गया!',' wins!'):(NM[cur()][lang==='h'?1:0]+tt(' की बारी',"'s turn")+(G.names[cur()]?' ('+G.names[cur()]+')':''));
 $('ldd').textContent=G.d||'🎲';$('ldm').innerHTML=G.chat.map(function(m){return '<div><b>'+m.n+':</b> '+m.m+'</div>'}).join('');$('ldm').scrollTop=9e9}
function fb(m,b){return fetch(FIREBASE_DB_URL+'/ludo/'+G.code+'.json',{method:m,body:b?JSON.stringify(b):undefined}).then(function(r){return r.json()})}
function save(){G.ver++;if(G.mode==='online')fb('PUT',pub()).catch(function(){})}
function pub(){var o={};['pl','names','t','turn','d','rolled','win','chat','ver'].forEach(function(k){o[k]=G[k]});return o}
function apply(o){['pl','names','t','turn','d','rolled','win','chat','ver'].forEach(function(k){if(o[k]!==undefined)G[k]=o[k]});G.chat=G.chat||[];G.names=G.names||{};G.win=G.win||null}
function startPoll(){clearInterval(poll);poll=setInterval(function(){if(!G)return;fb('GET').then(function(o){if(o&&o.ver>G.ver){apply(o);draw()}}).catch(function(){})},1500)}
var L=window.LudoGame={
 start:function(n){G=fresh(n===2?['red','yellow']:COL.slice(),'offline');gameUI()},
 create:function(){pname=$('ldn').value||'Player';var code=Math.random().toString(36).slice(2,6).toUpperCase();G=fresh(['red'],'online');G.code=code;G.names.red=pname;me='red';save();gameUI();startPoll()},
 join:function(){pname=$('ldn').value||'Player';var code=($('ldc').value||'').trim().toUpperCase();if(!code)return;G={code:code};fb('GET').then(function(o){if(!o){alert(tt('रूम नहीं मिला','Room not found'));G=null;return}
  var g=fresh(['red'],'online');g.code=code;G=g;apply(o);var free=COL.filter(function(c){return G.pl.indexOf(c)<0})[0];if(!free){alert(tt('रूम भरा है','Room is full'));G=null;return}
  G.pl.push(free);G.names[free]=pname;me=free;save();gameUI();startPoll()}).catch(function(){G=null;alert(tt('नेटवर्क एरर','Network error'))})},
 exit:function(){clearInterval(poll);G=null;ludoAfter()},
 share:function(){var t=tt('Ludo खेलो! रूम कोड: ','Play Ludo! Room code: ')+G.code;if(navigator.share)navigator.share({text:t}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t)},
 roll:function(){if(!G||G.rolled||G.win||!mine())return;G.d=1+Math.floor(Math.random()*6);G.rolled=true;var c=cur(),l=movList(c);save();draw();
  if(!l.length)setTimeout(function(){G.rolled=false;G.turn=(G.turn+1)%G.pl.length;save();draw()},900);
  else if(l.length===1||l.every(function(i){return G.t[c][i]===G.t[c][l[0]]}))setTimeout(function(){L.mv(c,l[0])},400)},
 mv:function(c,i){if(!G||!G.rolled||G.win||c!==cur()||!mine()||!mov(c,i))return;var ns=G.t[c][i]<0?0:G.t[c][i]+G.d,cap=false;G.t[c][i]=ns;
  if(ns<=50&&SAFE.indexOf(ab(c,ns))<0)G.pl.forEach(function(o){if(o!==c)for(var j=0;j<4;j++){var s=G.t[o][j];if(s>=0&&s<=50&&ab(o,s)===ab(c,ns)){G.t[o][j]=-1;cap=true}}});
  if(G.t[c].every(function(s){return s===56}))G.win=c;
  var extra=G.d===6||cap||ns===56;G.rolled=false;if(!extra)G.turn=(G.turn+1)%G.pl.length;save();draw()},
 chat:function(){var v=$('ldi').value.trim();if(!v||!G)return;G.chat.push({n:G.names[me]||'Me',m:v.replace(/</g,'&lt;')});G.chat=G.chat.slice(-30);$('ldi').value='';save();draw()}
};
window.ludoView=function(){return '<style>'+css()+'</style><div id="ld"></div>'};
window.ludoAfter=function(){if(G&&G.pl)gameUI();else menuUI()};
})();

["🏛️","संविधान सभा का गठन",[
["शुरुआती माँग",["1895: बाल गंगाधर तिलक के स्वराज विधेयक में संविधान सभा का पहला उल्लेख।","1922: गांधीजी ने कहा कि संविधान निर्माण दक्षिण अफ्रीका के संविधान के तर्ज पर होना चाहिए।","1927: लॉर्ड बर्किन हेड की चुनौती → 1928 में मोतीलाल नेहरू की अध्यक्षता में नेहरू रिपोर्ट।","1934: एम.एन. रॉय ने पहली बार माँग की (व्यक्तिगत माँग)। जून 1934 में कांग्रेस कार्यसमिति ने पहली औपचारिक माँग की।","1938: नेहरू ने वयस्क मताधिकार पर आधारित संविधान सभा की माँग रखी।","8 अगस्त 1940: लॉर्ड लिनलिथगो के अगस्त प्रस्ताव में ब्रिटिश सरकार ने माँग स्वीकार की।","1942: क्रिप्स मिशन में भी प्रावधान था, पर दलों की असहमति से असफल रहा।"]],
["तत्कालीन भारत",["11 ब्रिटिश प्रांत, 4 चीफ कमिश्नरियाँ और अनेक देशी रियासतें।","ब्रिटिश प्रांत: पंजाब, संयुक्त प्रांत, मध्य प्रांत व बरार, बिहार, बंगाल, असम, उड़ीसा, मद्रास, बम्बई, पश्चिमोत्तर सीमांत प्रांत, सिंध।","चीफ कमिश्नरियाँ: अजमेर-मेरवाड़ा, बलूचिस्तान, कुर्ग, दिल्ली।"]],
["कैबिनेट मिशन (मंत्रिमंडलीय योजना)",["संविधान सभा का गठन कैबिनेट मिशन के प्रावधानों के तहत हुआ।","23 मार्च 1946 को भारत (कराची) पहुँचा, 24 मार्च 1946 को दिल्ली।","तीन सदस्य: पैथिक लॉरेंस (अध्यक्ष), स्टैफर्ड क्रिप्स, ए.वी. एलेक्जेंडर।","योजना 16 मई 1946 को प्रकाशित हुई।","10 लाख की जनसंख्या पर एक सदस्य। कुल सदस्य 389: ब्रिटिश भारत 296 (प्रांत 292 + चीफ कमिश्नरी 4) और देशी रियासत 93।","296 सीटें तीन धार्मिक समूहों में बँटीं: सामान्य 213, मुस्लिम 79, सिख 04 (केवल पंजाब में)।","296 सदस्यों का निर्वाचन अप्रत्यक्ष रूप से प्रांतीय विधानसभाओं के सदस्यों द्वारा, आनुपातिक प्रतिनिधित्व की एकल संक्रमणीय मत प्रणाली से।","देशी रियासतों की 93 सीटों पर सदस्यों का मनोनयन परामर्श के आधार पर।","Note: संविधान सभा आंशिक रूप से निर्वाचित और आंशिक रूप से मनोनीत निकाय थी। चुनाव सार्वभौमिक वयस्क मताधिकार पर नहीं हुआ, यह अप्रत्यक्ष निर्वाचन का परिणाम थी।"]],
["चुनाव (जुलाई-अगस्त 1946)",["कांग्रेस 208, मुस्लिम लीग 73, यूनियनिस्ट पार्टी 3, अनुसूचित जाति परिसंघ 1, कृषक प्रजा पार्टी 1, कम्युनिस्ट 1, सिख गैर कांग्रेसी 1, निर्दलीय 8 = कुल 296।","मुस्लिम लीग ने अपनी कमजोर स्थिति देखकर बहिष्कार किया और पाकिस्तान की माँग करते हुए अलग संविधान सभा माँगी।","विभाजन के बाद पुनर्गठन: ब्रिटिश प्रांत 226 + चीफ कमिश्नरी 3 + देशी रियासतें 70 = 299।","पुनर्गठित संविधान सभा की पहली बैठक 31 अक्टूबर 1947 को हुई।"]],
["प्रांतवार सीटें",["संयुक्त प्रांत 55, मद्रास 49, बिहार 36, बम्बई 21, पश्चिमी बंगाल 19, मध्य प्रांत व बरार 17, पंजाब 12, उड़ीसा 9, असम 8।","सर्वाधिक सीटें: ब्रिटिश प्रांत में संयुक्त प्रांत (55), देशी रियासत में हैदराबाद (16)।","Note: हैदराबाद एकमात्र ऐसी देशी रियासत थी जिसके प्रतिनिधि संविधान सभा में शामिल नहीं हुए। अतः शामिल होने वाली सबसे बड़ी रियासत मैसूर (07) थी।"]],
["जो सदस्य नहीं थे",["महात्मा गांधी, तेज बहादुर सप्रू और जयप्रकाश नारायण संविधान सभा के सदस्य नहीं थे।","सप्रू ने स्वास्थ्य कारणों से इनकार किया। जयप्रकाश नारायण ने यह कहकर ठुकराया कि सभा जनता द्वारा प्रत्यक्ष रूप से नहीं चुनी गई, इसलिए सही प्रतिनिधित्व नहीं करती।"]],

]],
["📜","संविधान निर्माण",[
["बैठकें और पदाधिकारी",["पहली बैठक 9 दिसंबर 1946 को हुई, 211 सदस्य शामिल हुए।","जे.बी. कृपलानी के आग्रह पर वरिष्ठतम सदस्य डॉ. सच्चिदानंद सिन्हा अस्थायी अध्यक्ष बनाए गए। उन्होंने उसी दिन फ्रैंक एंथोनी को उपाध्यक्ष नियुक्त किया।","जे.बी. कृपलानी संविधान सभा में बोलने वाले प्रथम वक्ता थे।","दूसरी बैठक 10 दिसंबर 1946: अध्यक्ष पद हेतु नामांकन पत्र भरे गए।","तीसरी बैठक 11 दिसंबर 1946: राजेन्द्र प्रसाद निर्विरोध अध्यक्ष निर्वाचित हुए।","प्रथम सत्र 9 दिसंबर से 23 दिसंबर 1946 तक चला।","उपाध्यक्ष: फ्रैंक एंथनी (मनोनीत)। 25 जनवरी 1947 को एच.सी. मुखर्जी निर्विरोध उपाध्यक्ष चुने गए, पर विभाजन के साथ उनकी सदस्यता समाप्त होने से पद रिक्त हो गया।","16 जुलाई 1947 को नियम बदलकर दो उपाध्यक्ष चुने गए: एच.सी. मुखर्जी और वी.टी. कृष्णामाचारी। एन.बी. खरे के सुझाव पर एक उपाध्यक्ष देशी रियासतों से चुना गया।","संवैधानिक सलाहकार: बी.एन. राव (नियुक्ति तत्कालीन गवर्नर जनरल लॉर्ड वेवेल ने की)।","संविधान सभा के सचिव: एच.वी.आर. आयंगर।"]],
["उद्देश्य प्रस्ताव",["13 दिसंबर 1946 को जवाहर लाल नेहरू ने संविधान सभा के समक्ष (8 सूत्रीय) उद्देश्य प्रस्ताव पेश किया।","16 दिसंबर 1946 को एम.आर. जयकर के सुझाव पर चर्चा तब तक स्थगित की गई जब तक मुस्लिम लीग और देशी रियासतों के प्रतिनिधि शामिल न हो जाएँ।","22 जनवरी 1947 को संविधान सभा द्वारा सर्वसम्मति से पारित।"]],
["प्रमुख समितियाँ",["संघ संविधान समिति – जवाहर लाल नेहरू","संघ शक्ति समिति – जवाहर लाल नेहरू","राज्यों से समझौता समिति – जवाहर लाल नेहरू","प्रांतीय संविधान समिति – सरदार वल्लभ भाई पटेल","अल्पसंख्यक एवं मूल अधिकार समिति – सरदार वल्लभ भाई पटेल (अल्पसंख्यक अधिकार उपसमिति – एच.सी. मुखर्जी; मूल अधिकार उपसमिति – जे.बी. कृपलानी)","संचालन समिति – राजेन्द्र प्रसाद","नियम समिति – राजेन्द्र प्रसाद","प्रारूप समिति – भीमराव अम्बेडकर","कार्य संचालन समिति – के.एम. मुंशी","राष्ट्रीय ध्वज तदर्थ समिति – राजेन्द्र प्रसाद"]],
["प्रारूप समिति (Drafting Committee)",["गठन: 29 अगस्त 1947। सुझाव: सत्यनारायण राव। प्रथम बैठक: 30 अगस्त 1947। सदस्य: 07।","1. भीमराव अम्बेडकर (अध्यक्ष)","2. के.एम. मुंशी (उपाध्यक्ष), एकमात्र कांग्रेसी सदस्य","3. एन. गोपालस्वामी आयंगर","4. अल्लादि कृष्णास्वामी अय्यर","5. सैयद मोहम्मद सादुल्ला (एकमात्र मुस्लिम)","6. बी.एल. मित्तर (त्यागपत्र) → एन. माधव","7. डी.पी. खेतान (मृत्यु) → टी.टी. कृष्णामाचारी","प्रारूप समिति के सातों मूल सदस्य निर्वाचित थे। रिक्त पद पर संविधान सभा अध्यक्ष डॉ. राजेन्द्र प्रसाद ने क्रमशः एन. माधव और टी.टी. कृष्णामाचारी को नामजद/मनोनीत किया।","सदस्यों की सुविधा के लिए विश्व के 60 देशों के संविधानों के मुख्य प्रावधान संकलित कर उपलब्ध कराए गए।"]],
["मसौदा और वाचन",["पहला मसौदा संवैधानिक सलाहकार बी.एन. राव ने तैयार किया: 250 अनुच्छेद और 13 अनुसूचियाँ।","इसे आधार बनाकर प्रारूप समिति ने प्रारूप बनाया और 21 फरवरी 1948 को राजपत्र में प्रकाशित कर सुझाव आमंत्रित किए। संशोधित प्रारूप 26 अक्टूबर 1948 को पुनः मुद्रित हुआ।","प्रारूप समिति के प्रारूप में 315 अनुच्छेद और 8 अनुसूचियाँ थीं।","प्रथम वाचन: 4 नवंबर 1948 – 9 नवंबर 1948","द्वितीय वाचन: 15 नवंबर 1948 – 17 अक्टूबर 1949","तृतीय वाचन: 14 नवंबर 1949 – 26 नवंबर 1949","बहस के दौरान कुल 7635 संशोधन पेश हुए, जिनमें से 2473 स्वीकृत किए गए।"]],
["संविधान तैयार और लागू",["26 नवंबर 1949 को भारत का संविधान बनकर तैयार हुआ (अंगीकृत किया गया)।","नागरिकता, निर्वाचन, अंतरिम संसद तथा संक्रमणकालीन प्रावधान से संबंधित 16 अनुच्छेद (5, 6, 7, 8, 9, 60, 324, 366, 367, 379, 380, 388, 391, 392, 393, 394) उसी दिन लागू कर दिए गए – अनु. 394।","26 जनवरी 1930 को मनाए गए प्रथम स्वतंत्रता दिवस की स्मृति में शेष संविधान 26 जनवरी 1950 को लागू किया गया।","संविधान सभा की अंतिम बैठक 24 जनवरी 1950 को हुई।","संविधान निर्माण में 2 वर्ष, 11 माह और 18 दिन लगे।","संविधान सभा के कुल 12 सत्र हुए (9 दिसंबर 1946 से 26 नवंबर 1949 तक 11 सत्र, 24 जनवरी 1950 = 1 सत्र)।","प्रारूप समिति की कुल 114 बैठकें हुईं।","संविधान निर्माण में लगभग 64 लाख रुपये खर्च हुए।","संविधान की तीन मूल प्रतियों (2 English + 1 हिन्दी) पर संविधान सभा के 284 सदस्यों ने हस्ताक्षर किए।","हस्तलिखित प्रति को प्रेम बिहारी नारायण रायजादा ने लिपिबद्ध किया तथा नन्दलाल बोस ने इसके पृष्ठों पर चित्रांकन किया।","24 जनवरी 1950 को अंतिम बैठक में राष्ट्रगान और राष्ट्रगीत को मान्यता दी गई तथा डॉ. राजेन्द्र प्रसाद को अंतरिम (अस्थाई) राष्ट्रपति चुना गया।","संविधान सभा ने 22 जुलाई 1947 को तिरंगे को राष्ट्रध्वज के रूप में मान्यता दी।","मई 1949 में भारत की राष्ट्रमण्डल की सदस्यता को स्वीकृत किया गया।","मूल संविधान: 22 भाग, 395 अनुच्छेद और 8 अनुसूचियाँ।"]],
["संविधान सभा अंतरिम संसद के रूप में",["पहली बैठक: 17 नवम्बर 1947। अंतिम बैठक: 17 अप्रैल 1952। अध्यक्ष: गणेश वासुदेव मावलंकर।","आजादी के बाद कानून निर्माण के लिए व्यवस्थापिका आवश्यक थी, इसलिए संविधान सभा ने संविधान निर्माण के साथ कानून निर्माण का कार्य भी किया।","संविधान निर्माण के समय अध्यक्षता राजेन्द्र प्रसाद करते थे, अंतरिम संसद के रूप में गणेश वासुदेव मावलंकर।","9 Dec 1946 – 17 नवम्बर 1947: संविधान सभा","17 नवम्बर 1947 – 24 जनवरी 1950: संविधान सभा + अंतरिम संसद","24 जनवरी 1950 – 17 अप्रैल 1952: अंतरिम संसद","प्रथम संविधान संशोधन 1951 में इसी अंतरिम संसद (एक सदनीय संसद) द्वारा किया गया।"]],
["संविधान सभा पर टिप्पणियाँ",["संविधान सभा एक प्रभुत्व सम्पन्न निकाय नहीं थी। – एम.आर. जयकर","संविधान सभा भारतीय जनता का उचित प्रतिनिधित्व करने वाली संस्था नहीं है। – जय प्रकाश नारायण","संविधान सभा हिन्दुओं का निकाय थी। – लॉर्ड विस्काउंट","भारतीय संविधान सभा में वकीलों का प्रभुत्व था। – आइवर जेनिंग्स","संविधान सभा ही कांग्रेस थी और कांग्रेस ही संविधान सभा है। – ग्रेनविल ऑस्टिन"]]
]],
["📖","संविधान का सामान्य परिचय (भाग)",[

["भाग 6 से 9 ख",["भाग VI | अनु. 152-237 | राज्य सरकार","अध्याय-1: अनु. 152 → राज्य की परिभाषा","अध्याय-2: अनु. 153-167 → राज्य की कार्यपालिका","अध्याय-3: अनु. 168-212 → राज्य की व्यवस्थापिका (विधानमण्डल)","अध्याय-4: अनु. 213 → अध्यादेश","अध्याय-5: अनु. 214-232 → उच्च न्यायालय","अध्याय-6: अनु. 233-237 → अधीनस्थ न्यायालय","भाग VII | अनु. 238 | निरस्त (7वें संविधान संशोधन 1956 द्वारा निरस्त)","भाग VIII | अनु. 239-242 | केन्द्रशासित प्रदेशों का शासन","भाग IX | अनु. 243-243 ण | पंचायतें (73वाँ संविधान संशोधन 1992 द्वारा शामिल)","भाग IX क | अनु. 243 त – 243 यछ | नगरपालिका (74वें सं. सं. 1992 द्वारा)","भाग IX ख | अनु. 243 यज – 243 यन | सहकारी समितियाँ (97वाँ सं. सं. 2011)"]],
["भाग 10 से 14 क",["भाग X | अनु. 244-244 क | अनुसूचित एवं जनजाति क्षेत्रों का प्रशासन","भाग XI | अनु. 245-263 | केन्द्र-राज्य संबंध","अध्याय-1: अनु. 245-255 → केन्द्र-राज्य विधायी संबंध","अध्याय-2: अनु. 256-263 → प्रशासनिक संबंध","भाग XII | अनु. 264-300 क | संपत्ति, संविदाएँ व वाद","भाग XIII | अनु. 301-307 | भारत के भीतर व्यापार, वाणिज्य तथा समागम","भाग XIV | अनु. 308-323 | सेवाएँ, लोक सेवा आयोग","अध्याय-1: अनु. 308-314 → सेवाएँ","अध्याय-2: अनु. 315-323 → लोक सेवा आयोग","भाग XIV क | अनु. 323 क – 323 ख | अधिकरण (42वें सं. सं. 1976 द्वारा)"]],

["📋","अनुसूचियाँ (12)",[
["पहली, दूसरी, तीसरी",["पहली अनुसूची: राज्यों और UT's के नामों की सूची। राज्य – 28, केन्द्रशासित प्रदेश – 08। इसमें वर्तमान में दो सूचियाँ हैं: एक में राज्यों के नाम, दूसरी में केन्द्रशासित प्रदेशों के नाम।","मूल संविधान में पहली अनुसूची में चार श्रेणियों A, B, C, D के राज्यों के नाम थे। सातवें संविधान संशोधन 1956 द्वारा चार श्रेणियाँ समाप्त कर दो श्रेणियाँ – राज्य व केन्द्र शासित प्रदेश – बना दी गईं।","दूसरी अनुसूची: महत्वपूर्ण पदाधिकारियों का वेतन – राष्ट्रपति; लोकसभा अध्यक्ष व उपाध्यक्ष; राज्यसभा का सभापति और उपसभापति; सर्वोच्च न्यायालय का न्यायाधीश; नियंत्रक व महालेखा परीक्षक; राज्यपाल; विधानसभाध्यक्ष और उपाध्यक्ष; विधानपरिषद का सभापति और उपसभापति; उच्च न्यायालय के न्यायाधीश।","तीसरी अनुसूची: महत्वपूर्ण पदाधिकारियों की शपथ का प्रारूप – संघ सरकार के मंत्री; संसद का चुनाव लड़ने वाले प्रत्याशी; संसद के सदस्य; सर्वोच्च न्यायालय के न्यायाधीश; नियंत्रक व महालेखा परीक्षक; राज्य सरकार के मंत्री; विधानसभा का चुनाव लड़ने वाले प्रत्याशी; विधायक; उच्च न्यायालय के न्यायाधीश।","Note: तीसरी अनुसूची में राष्ट्रपति, उपराष्ट्रपति तथा राज्यपाल की शपथ के प्रारूप का उल्लेख नहीं किया गया है। इनका उल्लेख: राष्ट्रपति – अनु. 60, उपराष्ट्रपति – अनु. 69, राज्यपाल – अनु. 159।"]],
["चौथी, पाँचवीं, छठी",["चौथी अनुसूची: राज्यसभा में राज्यों की सीटें – उत्तरप्रदेश 31; महाराष्ट्र 19; तमिलनाडु 18; बिहार, प. बंगाल 16-16; कर्नाटक 12; आंध्रप्रदेश, गुजरात, मध्यप्रदेश 11-11; राजस्थान, उड़ीसा 10-10; केरल 9; पंजाब, असम, तेलंगाना 7-7; झारखण्ड 6; हरियाणा, छत्तीसगढ़ 5-5; जम्मू-कश्मीर 4; हिमाचल प्रदेश, उत्तराखण्ड, दिल्ली 3-3; अरुणाचल प्रदेश, नागालैण्ड, मणिपुर, मिजोरम, त्रिपुरा, मेघालय, सिक्किम, गोवा, पुदुच्चेरी 1-1।","पाँचवीं अनुसूची: अनुसूचित एवं जनजाति क्षेत्रों का प्रशासन।","छठी अनुसूची: असम, मेघालय, त्रिपुरा व मिजोरम के अनुसूचित तथा जनजाति क्षेत्रों का प्रशासन।"]],
["सातवीं अनुसूची",["केन्द्र और राज्य के बीच शक्ति वितरण। तीन सूचियाँ: संघ सूची, राज्य सूची, समवर्ती सूची।","संघ सूची: मूलतः विषय 97, वर्तमान में 100। निरस्त विषय: क्रमांक 33 (7वाँ सं. संशोधन 1956)। जोड़े गये: राज्यों में सैन्य सेवा का प्रयोग (42वाँ सं. संशोधन 1976); 92 क → राज्यों के बीच माल के क्रय-विक्रय पर कर (6वाँ सं. संशोधन 1956); 92 ख → राज्यों के बीच माल के परेषण पर कर (46वें सं. संशोधन 1982); 92 ग → सेवा कर (88वाँ सं. संशोधन 2003)।","राज्य सूची (राज्य विधानमण्डल): मूलतः विषय 66, वर्तमान में 61। निरस्त विषय: 11 (7वाँ सं. संशोधन 1956); 19, 20, 29, 36 (42वें सं. संशोधन)।","समवर्ती सूची (संसद / राज्य विधानमण्डल): मूलतः विषय 47, वर्तमान में 52। जोड़े गये (42वें सं. संशोधन 1976 द्वारा): क्रमांक 11 क – न्याय प्रशासन (नया); 17 क – वन; 17 ख – वन्य जीव एवं पक्षियों का संरक्षण; 20 क – जनसंख्या नियंत्रण (नया); 33 क – बाट एवं माप-तौल।","42वें सं. संशोधन 1976 द्वारा राज्य सूची से चार विषय (वन, वन्य जीव एवं पक्षियों का संरक्षण, शिक्षा, बाट एवं माप-तौल) हटाकर समवर्ती सूची में शामिल किए गए।","‘शिक्षा’ नामक विषय के लिए अलग से क्रमांक नहीं जोड़ा गया, बल्कि उसे समवर्ती सूची के क्रमांक संख्या 25 में ही शामिल कर लिया गया।","Note: इन तीनों सूचियों में संविधान संशोधन द्वारा विषय घटाये अथवा बढ़ाये जा सकते हैं लेकिन सूचियों की क्रमांक संख्या घटाई अथवा बढ़ाई नहीं जा सकती।"]],
["आठवीं अनुसूची – भाषाएँ",["मूलतः भाषा = 14, वर्तमान भाषा = 22।","21वाँ संविधान संशोधन 1967 → सिन्धी भाषा (14+1=15)।","71वाँ संविधान संशोधन 1992 → मणिपुरी, कोंकणी, नेपाली (15+3=18)।","92वाँ संविधान संशोधन 2003 → बोडो, डोगरी, मैथिली, संथाली (18+4=22)।","Note: ‘अंग्रेजी’ भाषा आठवीं अनुसूची में शामिल नहीं है।"]],
["नौवीं से बारहवीं",["नौवीं अनुसूची: भूमि सुधार कानून। प्रथम संविधान संशोधन 1951 द्वारा जोड़ी गई। अनु. 31 ख के अनुसार 9वीं अनुसूची में शामिल किसी विषय की न्यायिक समीक्षा नहीं की जा सकती। मूलतः 13 विषय, वर्तमान में 284 विषय।","अनु. 13(3): विधि के अंतर्गत अध्यादेश, आदेश, उपविधि, नियम, विनियम, अधिसूचना, विधि का बल रखने वाली रूढ़ियाँ तथा प्रथाएँ समाविष्ट होंगी। अनु. 13(3) में ‘संविधान संशोधन’ शब्द का प्रयोग नहीं किया गया, अतः यह विवाद का विषय रहा है।","दसवीं अनुसूची: दल-बदल निरोधक कानून। 52वें संविधान संशोधन 1985 द्वारा जोड़ी गई।","ग्यारहवीं अनुसूची: पंचायतीराज। 73वें संविधान संशोधन 1992 द्वारा जोड़ी गई। पंचायतीराज को 29 विषय दिये गये।","बारहवीं अनुसूची: नगरीय स्वशासन (नगरपालिका)। 74वें संविधान संशोधन 1992 द्वारा जोड़ी गई। इसमें नगरपालिकाओं को 18 विषय दिये गये।"]]
]],
["⭐","संविधान की विशेषताएँ",[
["18 विशेषताएँ",["1. सबसे बड़ा संविधान","2. लिखित संविधान","3. संसदीय शासन प्रणाली","4. संविधान की सर्वोच्चता","5. संघात्मक और एकात्मक शासन का समन्वय","6. कठोरता और लचीलेपन का समन्वय","7. लोकतंत्र","8. गणतंत्र","9. पंथ निरपेक्षता","10. प्रभुत्व-सम्पन्न","11. स्वतंत्र न्यायपालिका","12. एकीकृत न्यायपालिका","13. न्यायिक पुनरावलोकन","14. सार्वभौमिक वयस्क मताधिकार","15. आपातकालीन प्रावधान","16. मूल अधिकार","17. नीति निर्देशक तत्व","18. स्वतंत्र एवं निष्पक्ष निर्वाचन व्यवस्था"]]

["🌍","संविधान के स्रोत",[
["ब्रिटेन",["संसदीय शासन व्यवस्था; विधि का शासन; एकल नागरिकता; विधायी प्रक्रिया; सामूहिक उत्तरदायित्व सिद्धांत; राष्ट्रपति की संवैधानिक स्थिति; मंत्रिमंडलीय शासन; विधि के समक्ष समता; संसदीय विशेषाधिकार; द्विसदनीय व्यवस्थापिका; रिटें।","दूसरी सूची के अनुसार: संसदीय शासन; इकहरी नागरिकता; द्विसदनीय व्यवस्थापिका; विधि का शासन; विधि के समक्ष समता; विधि निर्माण की प्रक्रिया; परमाधिकार रीटें; संसदीय विशेषाधिकार; संसदीय प्रक्रिया; CAG; फर्स्ट पास्ट द पोस्ट सिस्टम; मंत्रिमंडलीय शासन; सामूहिक उत्तरदायित्व; राष्ट्रपति की संवैधानिक स्थिति।"]],
["अमेरिका",["मूल अधिकार; स्वतंत्र न्यायपालिका; न्यायिक पुनरावलोकन; संविधान की सर्वोच्चता; निर्वाचित राष्ट्रपति व महाभियोग; उपराष्ट्रपति का पद; वित्तीय आपातकाल; विधि का समान संरक्षण; प्रस्तावना; न्यायाधीशों को पद से हटाने की प्रक्रिया।"]],
["अन्य देश",["कनाडा: संघीय व्यवस्था; अवशिष्ट शक्तियाँ केन्द्र के पास; राज्यपाल की नियुक्ति; शक्ति विभाजन; सर्वोच्च न्यायालय की सलाहकारी अधिकारिता; केन्द्र राज्य संबंध।","आस्ट्रेलिया: प्रस्तावना की भाषा; समवर्ती सूची; संसद की संयुक्त बैठक।","आयरलैण्ड: नीति निर्देशक तत्व; राष्ट्रपति द्वारा राज्यसभा में सदस्यों का मनोनयन; राष्ट्रपति का निर्वाचन।","दक्षिण अफ्रीका: संविधान संशोधन की प्रक्रिया; राज्य सभा में सदस्यों का निर्वाचन।","जर्मनी: आपातकालीन उपबंध।","जापान: विधि द्वारा स्थापित प्रक्रिया।","फ्रांस: गणतंत्रात्मक व्यवस्था; समता, स्वतंत्रता और बंधुता का आदर्श।","सोवियत संघ: मूल कर्तव्य; प्रस्तावना में सामाजिक, आर्थिक एवं राजनीतिक न्याय का आदर्श।","भारत शासन अधिनियम 1935 (Government of India Act): संघीय व्यवस्था; राज्यपाल का कार्यालय; न्यायपालिका का ढाँचा; लोक सेवा आयोग; आपातकालीन उपबंध; शक्तियों के वितरण में तीन सूचियाँ।"]]
]],
["✏️","संविधान संशोधन (भाग XX)",[
["प्रक्रिया का स्रोत और प्रकार",["भाग – XX (अनु. 368)। स्रोत – दक्षिणी अफ्रीका।","लचीला संविधान: ऐसा संविधान जिसमें संशोधन करना आसान हो, यानी सरल और सामान्य तरीके से संशोधन किया जा सके। इसमें सामान्य विधि और संवैधानिक विधि समान प्रक्रिया से निर्मित होती है।","कठोर संविधान: ऐसा संविधान जिसमें संशोधन सामान्य प्रक्रिया से नहीं किया जा सके, बल्कि संशोधन करने की विशेष प्रक्रिया हो। इसमें सामान्य विधियों और संवैधानिक विधियों बनाने की प्रक्रिया अलग-अलग होती है।","सामान्य विधियाँ: संसद द्वारा बनाए गए कानून। संवैधानिक विधियाँ: संविधान में किए जाने वाले संशोधन।","संघीय शासन वाले देशों में संविधान का कठोर होना आवश्यक है, क्योंकि संघ और राज्यों के बीच शक्तियों का विभाजन होता है। जिसमें केवल केन्द्र द्वारा संशोधन किया जा सके वह लचीला; जिसमें केन्द्र और राज्य दोनों की भागीदारी आवश्यक हो वह कठोर। जैसे – अमेरिका, नाइजीरिया आदि।","भारत में संघीय स्वरूप के कारण ब्रिटिश संविधान की भाँति लचीली प्रक्रिया नहीं अपनाई जा सकती थी, और व्यापक एवं विस्तृत संविधान होने से अमेरिकी संविधान की भाँति अति कठोर प्रक्रिया भी नहीं। अतः संविधान निर्माताओं ने सामंजस्य और समन्वय की नीति से मध्यम मार्ग अपनाया और संशोधन की तीन प्रक्रियाएँ अपनाईं। हालाँकि अनु. 368 में केवल 2 प्रक्रियाओं का उल्लेख है।"]],
["तीन प्रक्रियाएँ",["1) संसद के साधारण बहुमत से संशोधन: सामान्य महत्व के प्रावधान जिनके संशोधन से संविधान की संरचना पर प्रभाव नहीं पड़ता, जैसे – नए राज्यों का गठन; राज्य के नाम, सीमा अथवा क्षेत्र में परिवर्तन; राष्ट्रपति, लोकसभा अध्यक्ष, न्यायाधीश आदि के वेतन में संशोधन; संसदीय विशेषाधिकारों में संशोधन; नागरिकता संबंधी प्रावधानों में संशोधन; किसी राज्य विधानपरिषद का सृजन अथवा उत्सादन।","Note: इस प्रक्रिया का उल्लेख अनु. 368 में नहीं किया गया है, अतः ऐसे संशोधन को तकनीकी रूप से संविधान संशोधन नहीं माना जाता।","2) संसद के विशेष बहुमत से संशोधन: संविधान के अधिकांश हिस्से में संशोधन इसी प्रक्रिया से होता है। विधेयक के पारित होने के लिए संसद के दोनों सदनों के विशेष बहुमत की आवश्यकता होती है।","3) विशेष बहुमत + कम से कम आधे राज्यों का अनुसमर्थन: संघीय स्वरूप से संबंधित प्रावधानों में। अनु. 368(2) के प्रावधान: (i) राष्ट्रपति का निर्वाचन (अनु. 54 व 55); (ii) संघ और राज्यों की कार्यपालिका शक्ति का विस्तार (73 व 162); (iii) संघ, राज्य और UTs की न्यायपालिका (124-147, 214-232, 241); (iv) केन्द्र-राज्य विधायी संबंध (245-255); (v) चौथी अनुसूची; (vi) सातवीं अनुसूची; (vii) अनु. 368।","Note: अनुच्छेद 368 में केवल दूसरी तथा तीसरी प्रक्रिया का ही उल्लेख किया गया है।"]],
["संविधान संशोधन विधेयक की प्रक्रिया",["कोई संविधान संशोधन विधेयक संसद के किसी भी सदन में पेश किया जा सकता है।","पारित होने के लिए सदन के विशेष बहुमत (सदन की कुल सदस्य संख्या का बहुमत तथा उपस्थित एवं मतदान करने वाले सदस्यों का 2/3 बहुमत) की आवश्यकता होती है।","एक सदन से पारित विधेयक को दूसरा सदन भी विशेष बहुमत से पारित कर दे तो यह संसद से पारित हो जाता है। लेकिन दूसरा सदन पारित न करे अथवा ऐसे संशोधन के साथ पारित करे जिस पर पहला सदन सहमत नहीं है तो विधेयक समाप्त हो जाता है। अर्थात् संविधान संशोधन विधेयक पर दोनों सदनों की शक्तियाँ एकदम समान होती हैं।","Note: संविधान संशोधन विधेयक पर संयुक्त बैठक का कोई प्रावधान नहीं होता।","संघीय ढाँचे से संबंधित विधेयक पर कम से कम आधे राज्यों का अनुसमर्थन आवश्यक होता है। इसके बाद विधेयक राष्ट्रपति की स्वीकृति हेतु जाता है।","राष्ट्रपति संविधान संशोधन विधेयक पर अपनी स्वीकृति नहीं रोक सकता, अर्थात् वह इसे स्वीकृति देने हेतु बाध्य है। 24वें सं. संशो. 1971 द्वारा अनु. 368 में संशोधन कर ऐसा प्रावधान किया।"]],
["संविधान का मूल ढाँचा",["मूल ढाँचे की संकल्पना सर्वप्रथम केशवानन्द भारती वाद (1973) में प्रतिपादित की गई। मूल ढाँचे से तात्पर्य संविधान के कुछ ऐसे प्रावधानों से है जिन पर पूरा संविधान टिका हुआ है, अर्थात् इन प्रावधानों में संशोधन करने से पूरे संविधान का स्वरूप ही बदल जाता है।","केशवानन्द भारती वाद 1973: (i) संविधान की सर्वोच्चता (ii) सरकार का लोकतांत्रिक ढाँचा (iii) सरकार का गणतंत्रीय स्वरूप (iv) कार्यपालिका, व्यवस्थापिका और न्यायपालिका में शक्तियों का पृथक्करण (v) देश की संप्रभुता (vi) संघात्मक स्वरूप (vii) संविधान का धर्मनिरपेक्ष स्वरूप","इंदिरा गांधी बनाम राजनारायण वाद 1975: (i) विधि का शासन (ii) स्वतंत्र एवं निष्पक्ष चुनाव प्रणाली पर आधारित लोकतंत्र","मिनर्वा मिल्स वाद 1980: (i) संसद की संविधान संशोधन करने की सीमित शक्ति (ii) मूल अधिकार एवं नीति निर्देशक तत्वों के बीच संतुलन (iii) न्यायिक पुनरावलोकन","एस.पी. गुप्ता वाद 1982: अनु. 32 के तहत सर्वोच्च न्यायालय की अधिकारिता","एस.आर. बोम्मई वाद 1994: (i) संविधान का संघात्मक ढाँचा (ii) संविधान की धर्म निरपेक्ष प्रकृति"]],
["अनुच्छेद 13 और प्रमुख वाद",["अनु. 13(3): विधि के अंतर्गत अध्यादेश, आदेश, उपविधि, नियम, विनियम, अधिसूचना, विधि का बल रखने वाली रूढ़ियाँ तथा प्रथाएँ शामिल हैं। अनु. 13(3) में ‘संविधान संशोधन’ शब्द का प्रयोग नहीं है।","शंकरी प्रसाद वाद 1951: प्रथम संविधान संशोधन को न्यायालय में चुनौती दी गई। सर्वोच्च न्यायालय ने निर्णय दिया कि मूल अधिकारों में संविधान संशोधन किया जा सकता है। अतः प्रथम संविधान संशोधन की वैधता दी गई।","गोलकनाथ वाद 1967: 11 न्यायाधीशों की पीठ ने 6:5 के बहुमत से निर्णय दिया कि अनु. 13(3) में यद्यपि संविधान संशोधन शब्द का उल्लेख नहीं है लेकिन संविधान संशोधन विधि शब्द के अंतर्गत ही अंतर्निहित है। अतः मूल अधिकारों में संविधान संशोधन नहीं किया जा सकता।","25वाँ संविधान संशोधन 1971: गोलकनाथ केस के निर्णय को निष्प्रभावी करने हेतु अनु. 13(4) जोड़कर यह प्रावधान किया गया कि संविधान संशोधन विधि के अंतर्गत नहीं आता, अर्थात् अनु. 368 (अनु. 13) के अंतर्गत शामिल नहीं होता, अर्थात् मूल अधिकारों में संविधान संशोधन किया जा सकता है।","केशवानन्द भारती वाद 1973: सर्वोच्च न्यायालय ने 25वें संविधान संशोधन को वैधता प्रदान की, अर्थात् मूल अधिकारों में संविधान संशोधन किया जा सकता है लेकिन साथ ही संविधान के मूल ढाँचे का सिद्धान्त प्रतिपादित करते हुए यह निर्णय दिया कि मूल अधिकार सहित संविधान के किसी भी हिस्से में संविधान संशोधन किया जा सकता है, लेकिन संविधान के मूल ढाँचे में संशोधन नहीं किया जा सकता।","वामन राव वाद 1981: सर्वोच्च न्यायालय ने निर्णय दिया कि 24 अप्रैल 1973 के बाद नवीं अनुसूची में शामिल ऐसे विषय की न्यायिक समीक्षा की जा सकती है जो संविधान के मूल ढाँचे का उल्लंघन करता हो।"]],
["महत्वपूर्ण संविधान संशोधन (1)",["प्रथम सं. सं. 1951: 9वीं अनुसूची, अनु. 31 क, 31 ख, 15(4) जोड़ा गया। भूमि सुधार कानूनों को 9वीं अनुसूची में जोड़ा। अनु. 31 ख: 9वीं अनुसूची के किसी कानून को न्यायालय में चुनौती नहीं दी जा सकेगी। अनु. 15(4): अनुसूचित जाति, जनजाति तथा सामाजिक-शैक्षिक दृष्टि से पिछड़े वर्गों के लिए राज्य विशेष उपाय कर सकेगा।","7वाँ सं. सं. 1956: राज्यों का पुनर्गठन; राज्यों की चार श्रेणियाँ (A,B,C,D) समाप्त कर पहली अनुसूची में दो श्रेणियाँ (राज्य व केन्द्रशासित प्रदेश)। उस समय 15 राज्य व 6 केन्द्रशासित प्रदेश। भाग-VII तथा भाग-VIII निरस्त। अनु. 153 में संशोधन: एक ही व्यक्ति दो या अधिक राज्यों का राज्यपाल हो सकता है। लोकसभा की सीटें 500 से बढ़ाकर 525 (500+25 = राज्य + UTs)।","21वाँ सं. सं. 1967: आठवीं अनुसूची में सिंधी भाषा शामिल, भाषाओं की संख्या 15।","24वाँ सं. सं. 1971: अनु. 13(4) जोड़कर प्रावधान कि अनु. 368 के तहत किए गए संविधान संशोधन अनु. 13 पर प्रभावी नहीं होंगे, अर्थात् मौलिक अधिकारों में संशोधन किया जा सकता है। अनु. 368(3) जोड़ा। राष्ट्रपति संविधान संशोधन विधेयक पर स्वीकृति रोक नहीं सकेगा, बाध्य। भाग XX (अनु. 368) का शीर्षक बदलकर ‘संसद की संविधान संशोधन करने की शक्ति तथा इसके लिए प्रक्रिया’ किया गया।","25वाँ सं. सं. 1971: अनु. 31 ग जोड़ा गया – अनु. 39(ख) तथा 39(ग) की अनुपालना में राज्य द्वारा बनाई गई किसी विधि को इस आधार पर न्यायालय में चुनौती नहीं दी जा सकेगी कि वह अनु. 14, 19 तथा 31 का उल्लंघन करती है।","26वाँ सं. सं. 1971: देशी नरेशों के लिए ‘प्रिवीपर्स’ प्रावधान समाप्त।","31वाँ सं. सं. 1973: लोकसभा की सीटें 525 से बढ़ाकर 545 (525 राज्यों के लिए तथा 20 केन्द्रशासित प्रदेशों के लिए)।","35वाँ सं. सं. 1974: सहभागी राज्य (Associate State) का दर्जा (सिक्किम)।","36वाँ सं. सं. 1975: सिक्किम को पूर्ण राज्य का दर्जा देते हुए 22वें राज्य के रूप में शामिल किया गया।"]],
["42वाँ संविधान संशोधन 1976",["यह संशोधन सबसे अधिक व्यापक तथा विस्तृत था, अतः इसे ‘लघु संविधान’ (Mini Constitution) कहा जाता है। स्वर्ण सिंह समिति की सिफारिश के आधार पर किया गया।","प्रस्तावना में तीन शब्द जोड़े: समाजवादी, पंथनिरपेक्ष, अखण्डता।","चार नए नीति-निर्देशक तत्व: अनु. 39(F), 39(A), 43(A), 48(A)।","भाग-IV क जोड़कर अनु. 51 क के अंतर्गत 10 मौलिक कर्तव्य।","अनु. 55 में संशोधन कर राष्ट्रपति के निर्वाचन में मत मूल्यों के निर्धारण हेतु 1971 की जनगणना निर्धारित।","अनु. 81 तथा 82: लोकसभा व विधानसभाओं के परिसीमन हेतु 1971 की जनगणना; सीटें 2000 के बाद होने वाली जनगणना तक यथावत।","लोकसभा तथा विधानसभाओं का कार्यकाल 5 वर्ष से बढ़ाकर 6 वर्ष।","अनु. 74(1): राष्ट्रपति को मंत्रिपरिषद की सलाह मानने के लिए बाध्य कर दिया गया।","अनु. 31 ग में संशोधन: भाग IV के सभी नीति-निर्देशक तत्वों की अनुपालना में बनी विधियाँ इस आधार पर अवैध नहीं होंगी कि वे अनु. 14, 19 तथा 31 का उल्लंघन करती हैं।","अनु. 368(4): संसद द्वारा किए गए संविधान संशोधनों को न्यायालय में चुनौती नहीं दी जा सकती। अनु. 368(5): संसद को संविधान में संशोधन करने की असीमित शक्तियाँ (मूल ढाँचे के सिद्धान्त को निष्प्रभावी करने के लिए)।","सातवीं अनुसूची: राज्य सूची के चार विषय (वन; वन्य जीव एवं पक्षियों का संरक्षण; शिक्षा; बाट एवं माप तौल) समवर्ती सूची में। समवर्ती सूची में 02 नए विषय: न्याय प्रशासन; जनसंख्या नियंत्रण एवं परिवार नियोजन।","Note: मिनर्वा मिल्स वाद 1980 में सर्वोच्च न्यायालय ने अनु. 368(4) तथा 368(5) को अवैध घोषित किया तथा अनु. 31(ग) में किए गए संशोधन को असंवैधानिक घोषित करते हुए 25वें सं. संशो. द्वारा अनु. 31(ग) में किए गए प्रावधानों को पुनः स्थापित किया।","भाग XIV क जोड़कर अनु. 323 क से 323 ख: प्रशासनिक अधिकरण के प्रावधान।"]],
["महत्वपूर्ण संविधान संशोधन (2)",["44वाँ सं. सं. 1978: संपत्ति के अधिकार तथा संपत्ति की स्वतंत्रता (अनु. 19(1)(च)) को मौलिक अधिकारों की श्रेणी से समाप्त कर कानूनी अधिकार के रूप में अनु. 300 क में स्थापित। अनु. 38(2) में एक नया नीति-निर्देशक तत्व। अनु. 74(1) में परन्तुक: राष्ट्रपति मंत्री-परिषद की सलाह को पुनर्विचार के लिए लौटा सकता है, पुनर्विचार के उपरांत दी गई सलाह के अनुसार कार्य करेगा।","अनु. 352 में संशोधन: ‘आन्तरिक अशांति’ शब्द समाप्त कर ‘सशस्त्र विद्रोह’ जोड़ा गया; राष्ट्रपति मंत्रिमंडल (कैबिनेट) के लिखित परामर्श पर ही उद्घोषणा करेगा; संसद के अनुमोदन के बिना राष्ट्रीय आपातकाल की अवधि 2 माह से घटाकर 1 माह; अनुमोदन हेतु विशेष बहुमत; आपातकाल समाप्त करने की शक्ति लोकसभा को (1/10 सदस्यों की माँग पर बुलाई गई विशेष बैठक में साधारण बहुमत से)।","अनु. 358: सशस्त्र विद्रोह के कारण घोषित राष्ट्रीय आपातकाल की दशा में प्रभावी नहीं होगा। अनु. 359: अनु. 20 तथा अनु. 21 को किसी भी दशा में निलंबित नहीं किया जा सकता। लोकसभा तथा विधानसभा का कार्यकाल घटाकर पुनः 5 वर्ष।","52वाँ सं. सं. 1985: 10वीं अनुसूची जोड़ी गई – दल-बदल के प्रावधान।","61वाँ सं. सं. 1989: अनु. 326 में संशोधन कर मताधिकार की न्यूनतम आयु 21 वर्ष से घटाकर 18 वर्ष।","65वाँ सं. सं. 1990: अनु. 338 में संशोधन – राष्ट्रीय अनुसूचित जाति तथा अनुसूचित जनजाति आयोग के गठन का प्रावधान।","69वाँ सं. सं. 1991: दिल्ली में विधानसभा का प्रावधान, अनु. 239 AA।","70वाँ सं. सं. 1992: अनु. 54 में संशोधन कर दिल्ली तथा पाण्डिचेरी विधानसभा के सदस्यों को राष्ट्रपति के निर्वाचन मण्डल में शामिल किया। Note: पाण्डिचेरी में विधानसभा के गठन का प्रावधान 14वें सं. संशोधन 1962 द्वारा किया गया।","71वाँ सं. सं. 1992: आठवीं अनुसूची में तीन नई भाषाएँ – कोंकणी, मणिपुरी, नेपाली।","73वाँ सं. सं. 1992: भाग-IX जोड़कर अनु. 243-243 ण तक कुल 16 अनुच्छेद; पंचायती राज को संवैधानिक मान्यता। 11वीं अनुसूची जोड़कर पंचायतों के लिए 29 विषय।","74वाँ सं. सं. 1992: भाग-IX क जोड़कर अनु. 243 त – 243 यछ तक कुल 18 अनुच्छेद; नगरीय निकायों को संवैधानिक दर्जा। 12वीं अनुसूची जोड़कर नगरीय निकायों को 18 विषय।","76वाँ सं. सं. 1994: तमिलनाडु में 69% आरक्षण को नवीं अनुसूची में शामिल कर दिया गया ताकि उसे न्यायिक समीक्षा से बचाया जा सके।","77वाँ सं. सं. 1995: अनु. 16(4क) जोड़कर पदोन्नति में आरक्षण का प्रावधान।","81वाँ सं. सं. 2000: अनु. 16(4ख) जोड़कर बैकलॉग का प्रावधान।","82वाँ सं. सं. 2000: अनु. 335 में संशोधन कर पिछड़े वर्गों के लिए सेवाओं में न्यूनतम अर्हता में छूट का प्रावधान।","84वाँ सं. सं. 2001: लोकसभा तथा विधानसभाओं की सीटें 2026 ई. तक यथावत कर दी गईं।","86वाँ सं. सं. 2002: अनु. 21 क जोड़कर शिक्षा के अधिकार (6-14 वर्ष) का प्रावधान। अनु. 45 में संशोधन कर 0-6 वर्ष के बच्चों की उचित देखभाल एवं शिक्षा हेतु राज्य को निर्देशित किया गया। अनु. 51 क में 11वाँ मौलिक कर्तव्य।","87वाँ सं. सं. 2003: परिसीमन हेतु 2001 की जनगणना निर्धारित।","89वाँ सं. सं. 2003: अनु. 338 क जोड़कर अनुसूचित जनजाति के लिए अलग से राष्ट्रीय अनुसूचित जनजाति आयोग का प्रावधान।","91वाँ सं. सं. 2003: 10वीं अनुसूची में संशोधन कर दल-बदल के प्रावधानों को अधिक कठोर किया गया। अनु. 75(1क): मंत्रिपरिषद में प्रधानमंत्री सहित मंत्रियों की अधिकतम संख्या लोकसभा की कुल सदस्य संख्या के 15% से अधिक नहीं होगी। अनु. 75(1ख): दल-बदल किए जाने पर मंत्री पद हेतु अयोग्य। अनु. 164(1क): राज्य मंत्रिपरिषद में मुख्यमंत्री सहित मंत्रियों की अधिकतम संख्या विधानसभा की कुल सदस्य संख्या के 15% से अधिक नहीं होगी तथा यह संख्या 12 से कम भी नहीं होगी। अनु. 164(1ख): दल-बदल पर मंत्री पद हेतु अयोग्य।","92वाँ सं. सं. 2003: आठवीं अनुसूची में 4 नई भाषाएँ – बोडो, डोगरी, मैथिली, संथाली।","93वाँ सं. सं. 2005: अनु. 15(5) जोड़कर राज्य SC-ST तथा सामाजिक दृष्टि से पिछड़े वर्गों के लिए शिक्षण संस्थाओं में विशेष प्रावधान कर सकेगा।","97वाँ सं. सं. 2011: भाग-IX ख जोड़कर अनु. 243 यज से 243 यन तक कुल 13 अनुच्छेद; सहकारी समिति को संवैधानिक दर्जा। अनु. 19(1)(ग) में संशोधन कर सहकारी समिति बनाने की स्वतंत्रता। अनु. 43 B जोड़कर सहकारी समितियों के गठन एवं विकास हेतु राज्यों को निर्देशित।","99वाँ सं. सं. 2014: SC तथा HC में न्यायाधीशों की नियुक्ति की सिफारिश करने हेतु राष्ट्रीय न्यायिक नियुक्ति आयोग (NJAC) के गठन का प्रावधान। सर्वोच्च न्यायालय ने ‘एडवोकेट्स ऑन रिकॉर्ड वाद-II’ 2015 में इसे असंवैधानिक घोषित करते हुए निरस्त कर दिया।","100वाँ सं. सं. 2015: भारत और बांग्लादेश की सीमा रेखा का पुनर्निर्धारण; कुल 162 एनक्लेव में से 111 एनक्लेव बांग्लादेश तथा 51 एनक्लेव भारत की सीमा में शामिल। पहली अनुसूची में संशोधन – पश्चिम बंगाल, मेघालय, असम तथा त्रिपुरा की सीमा रेखा में परिवर्तन।","101वाँ सं. सं. 2016: GST के प्रावधान; अनु. 269 में संशोधन। GST के प्रावधान 1 July 2017 से प्रभावी हुए।","102वाँ सं. सं. 2018: अनु. 338(ख) जोड़कर राष्ट्रीय पिछड़ा वर्ग आयोग का प्रावधान।","103वाँ सं. सं. 2019: अनु. 15(6) जोड़कर शिक्षण संस्थाओं में EWS के प्रवेश हेतु विशेष उपाय। अनु. 16(6) जोड़कर नौकरियों में EWS को 10% आरक्षण।","104वाँ सं. सं. 2019: अनु. 334 में संशोधन कर अनुसूचित जाति तथा अनुसूचित जनजाति के लिए लोकसभा तथा विधानसभाओं में आरक्षण की समय सीमा 10 वर्ष बढ़ाकर 2030 तक। लेकिन एंग्लो इंडियन के लिए यह समय सीमा नहीं बढ़ाई गई, अर्थात् एंग्लो भारतीयों के लोकसभा तथा विधानसभाओं में सदस्यों के मनोनयन का प्रावधान निष्प्रभावी हो गया।","105वाँ सं. सं. 2021: पिछड़े वर्गों की पहचान करने तथा उन्हें अधिसूचित करने की शक्ति राज्यों को भी प्रदान कर दी गई।"]]
]]

NOTES.push(
["🏢","राज्य विधानमंडल",[
["विधानमंडल (भाग VI)",["भाग - VI | अनु. 152-237 | राज्य सरकार","अध्याय - 3 | अनु. 168-212 | विधानमंडल","अनु. 168: प्रत्येक राज्य का एक विधानमंडल होगा जो राज्यपाल तथा कुछ राज्यों में एक सदन तथा कुछ राज्यों में दो सदनों से मिलकर बनेगा।","प्रत्येक राज्य में विधानमंडलों में दो सदनों का होना आवश्यक नहीं है।"]],
["विधानपरिषद",["उच्च सदन, द्वितीय सदन, अविघटनीय, समापनीय सदन।","अनु. 169 – सृजन या उत्सादन: किसी राज्य में विधानपरिषद का सृजन करना अथवा उसका उत्सादन करना संसद की शक्ति है। संसद ऐसा साधारण बहुमत से प्रस्ताव पारित करके कर सकती है, लेकिन केवल तभी जब उस राज्य की विधानसभा द्वारा विशेष बहुमत से प्रस्ताव पारित कर इस हेतु संसद से सिफारिश की हो।","अनु. 171 – गठन: अधिकतम सदस्य संख्या – उस राज्य की विधानसभा की कुल सदस्य संख्या के 1/3 के बराबर। न्यूनतम सदस्य संख्या – 40।","भारत में वर्तमान में 6 राज्यों में विधानपरिषद है: (1) उत्तरप्रदेश – 100 (2) महाराष्ट्र – 78 (3) बिहार – 75 (4) कर्नाटक – 75 (5) आंध्रप्रदेश – 58 (6) तेलंगाना – 40।"]],
["विधानपरिषद का निर्वाचन",["विधानपरिषद के विभिन्न सदस्यों को अलग-अलग निर्वाचक मण्डलों द्वारा चुना जाता है।","1/3 सदस्य – विधानसभा के सदस्यों द्वारा।","1/3 सदस्य – स्थानीय निकायों द्वारा (संसद द्वारा निर्धारित)।","1/12 सदस्य – स्नातक (3 वर्ष का अनुभव)।","1/12 सदस्य – माध्यमिक शिक्षा तथा उससे उच्च स्तर के तीन वर्ष का अनुभव प्राप्त शिक्षक।","1/6 सदस्य – राज्यपाल द्वारा मनोनीत।","मनोनयन: राज्यपाल 1/6 सदस्यों को मनोनीत करता है। ये ऐसे सदस्य होते हैं जिन्होंने कला, साहित्य, विज्ञान, समाजसेवा, सहकारिता में उल्लेखनीय कार्य किया हो।","विधानपरिषद में कुल के 5/6 सदस्य निर्वाचित होते हैं तथा 1/6 सदस्य मनोनीत होते हैं।","निर्वाचन आनुपातिक प्रतिनिधित्व की एकल संक्रमणीय मत प्रणाली से किया जाता है।","विधानसभा के सदस्यों द्वारा निर्वाचित 1/3 सदस्यों का निर्वाचन खुले मतदान प्रणाली से तथा शेष सदस्यों का निर्वाचन गुप्त मतदान प्रणाली से होता है।"]],
["कार्यकाल और शपथ",["अनु. 172 – कार्यकाल: विधानपरिषद एक स्थाई सदन है अर्थात् विधानपरिषद का विघटन नहीं किया जा सकता हालाँकि उसे समाप्त किया जा सकता है।","इसके सदस्यों का कार्यकाल 6 वर्ष होता है तथा प्रति दो वर्ष से एक तिहाई सदस्य अवकाश ग्रहण कर लेते हैं तथा उनके स्थान पर उतनी ही संख्या में नये सदस्य चुन लिए जाते हैं।","अनु. 188 – शपथ: विधानमण्डल के सदस्य (वि. सभा व वि. परिषद) राज्यपाल अथवा उसके द्वारा निर्धारित व्यक्ति के समक्ष शपथ ग्रहण करते हैं।","विधानपरिषद के सदस्यों को शपथ दिलाने हेतु राज्यपाल ने विधानपरिषद के सभापति को नियुक्त कर दिया।"]],
["पदाधिकारी (अनु. 182-185)",["1) सभापति: विधानपरिषद के सदस्य अपने में से ही किसी एक सदस्य को सभापति के रूप में चुन लेते हैं, अर्थात् सभापति विधानपरिषद का सदस्य होता है। त्यागपत्र – उपसभापति को।","सभापति के कार्य: सदन की अध्यक्षता करना; निर्णायक मत देना; सदस्यों को बोलने की अनुमति देना; सदन की गणपूर्ति को सुनिश्चित करना; सदन को स्थगित करना; विधानपरिषद के सदस्यों की अयोग्यता से सम्बंधित किसी विवाद का निर्णय करना; सदन के नियमों की व्याख्या करना।","2) उपसभापति: विधानपरिषद के सदस्य अपने में ही एक उपसभापति को चुनते हैं। उपसभापति विधानपरिषद का सदस्य रहने तक पद पर बना रहता है। त्यागपत्र – सभापति को। कार्य – सभापति की अनुपस्थिति में सदन की अध्यक्षता करना।","Note: सभापति तथा उपसभापति को 14 दिन की पूर्व सूचना के आधार पर पेश किए गए पद से हटाने के प्रस्ताव को सदन की कुल सदस्य संख्या के बहुमत से प्रस्ताव पारित कर पद से हटाया जा सकता है।"]]
]],
["🗳️","विधानसभा",[
["गठन (अनु. 170)",["निम्न सदन, प्रथम सदन, लोकप्रिय सदन।","अधिकतम सदस्य संख्या – 500। न्यूनतम सदस्य संख्या – 60।","Note: अनु. 371 के अनुसार कम जनसंख्या वाले राज्यों में विधानसभा की न्यूनतम सदस्य संख्या 60 से कम हो सकती है।","नागालैण्ड – 46 | मिजोरम – 40 | अरुणाचल प्रदेश, सिक्किम, गोवा – 30","विभिन्न राज्यों की सीटें: उत्तरप्रदेश – 403, प. बंगाल – 294, राजस्थान – 200, सिक्किम – 32।"]],
["परिसीमन, आरक्षण, निर्वाचन",["परिसीमन – 1952, 1962, 1972, 2002: समान जनसंख्या के आधार पर निर्वाचन क्षेत्रों का सीमांकन करना। इसकी न्यायिक समीक्षा नहीं की जा सकती। इसके निर्णय आगामी विधानसभा पर लागू होते हैं।","विधानसभा में आरक्षण – अनु. 332: विधानसभा में SC तथा ST को आरक्षण प्रदान किया गया है। राजस्थान विधानसभा में आरक्षित सीटें – SC – 34, ST – 25।","निर्वाचन – प्रत्यक्ष निर्वाचन: सार्वभौमिक वयस्क मताधिकार; प्रादेशिक प्रतिनिधित्व; एक सदस्यीय निर्वाचन क्षेत्र; फर्स्ट पास्ट द पोस्ट सिस्टम; गुप्त मतदान।"]],
["कार्यकाल (अनु. 172)",["विधानसभा का कार्यकाल उसकी पहली बैठक से पाँच वर्ष तक निर्धारित होता है।","सदस्य, स्पीकर को सम्बोधित त्यागपत्र से अपना पद पहले भी छोड़ सकते हैं।","राज्यपाल द्वारा मुख्यमंत्री की सलाह से इसे समय से पूर्व भी भंग किया जा सकता है।","राष्ट्रपति शासन लागू होने की स्थिति में मुख्यमंत्री की सलाह के बिना भी राज्यपाल विधानसभा को भंग कर सकता है।","राजस्थान की विधानसभाओं का कार्यकाल: (1) 1952-57 (160 सीटें) (2) 1957-62 (176 सीटें) (3) 1962-67 (176 सीटें) (4) 1967-72 (184 सीटें) (5) 1972-77 (184 सीटें) (6) 1977-80 (200 सीटें) (7) 1980-85 (8) 1985-90 (9) 1990-92 (10) 1993-98 (11) 1998-2003 (12) 2003-2008 (13) 2008-2013 (14) 2013-2018 (15) 2018 से निरन्तर।"]],
["शपथ और पदाधिकारी",["अनु. 188 – शपथ: विधानसभा के सदस्यों को शपथ दिलाने के लिए राज्यपाल उस नवनिर्वाचित विधानसभा के किसी अनुभवी सदस्य को प्रोटेम स्पीकर (सामयिक अध्यक्ष) के रूप में नियुक्त कर देता है। यह प्रोटेम स्पीकर सभी सदस्यों को शपथ दिलाता है जबकि वह स्वयं राज्यपाल के समक्ष शपथ ग्रहण करता है।","अनु. 178-181 – पदाधिकारी – 2","1) विधानसभा अध्यक्ष: विधानसभा के सदस्य अपने में से ही किसी एक सदस्य को विधानसभा अध्यक्ष के रूप में चुन लेते हैं, अर्थात् अध्यक्ष विधानसभा का सदस्य होता है। नई विधानसभा की पहली बैठक के ठीक पहले तक पद पर बना रहता है। त्यागपत्र – उपाध्यक्ष को।","पद से हटाना: 14 दिन की पूर्व सूचना के आधार पर पेश किये गए ऐसे विधेयक (प्रस्ताव) को सदन की कुल सदस्य संख्या के बहुमत से पारित कर दिये जाने पर उसे पद से हटाया जा सकता है।","विधानसभा अध्यक्ष के कार्य: (1) सदन की अध्यक्षता करना (2) सदस्यों को बोलने की अनुमति प्रदान करना (3) सदन की गणपूर्ति का विनिश्चय करना (4) सदन के नियमों की व्याख्या करना (5) सदन को स्थगित करना (6) कोई विधेयक धन विधेयक है या नहीं, इसका विनिश्चय करना (7) विधानसभा के सदस्यों की दल-बदल से सम्बंधी अयोग्यताओं के विवाद का निर्णय करना (8) निर्णायक मत देना।","2) विधानसभा उपाध्यक्ष (डिप्टी स्पीकर): विधानसभा के सदस्यों द्वारा अपने में से ही किसी एक सदस्य को उपाध्यक्ष के रूप में चुन लिया जाता है। त्यागपत्र – विधानसभा अध्यक्ष को। इसे 14 दिन की पूर्व सूचना के आधार पर सदन की कुल सदस्य संख्या के बहुमत से पारित प्रस्ताव से हटाया जा सकता है। यह अध्यक्ष की अनुपस्थिति में बैठकों की अध्यक्षता करता है।"]],
["विधेयक",["साधारण विधेयक: विधानमण्डल के किसी भी सदन में पेश किया जा सकता है। विधानसभा में पेश किए गए साधारण विधेयक को विधानपरिषद तीन माह तक रोक सकती है।","दोनों सदनों में साधारण विधेयक पर गतिरोध होने पर यहाँ संयुक्त बैठक का कोई प्रावधान नहीं है।","टकराव की स्थिति में यदि विधानसभा इस विधेयक को पुनः पारित कर दे तो विधानपरिषद उसे अधिकतम 1 माह तक रोक सकती है। इस एक माह के उपरांत यह विधेयक ठीक वैसे ही पारित हो जाता है, जैसा कि विधानसभा में इसे पारित किया था। अर्थात् विधानपरिषद किसी साधारण विधेयक को अधिकतम 4 माह (3+1) तक रोक सकती है।","विधेयक पर राज्यपाल की स्वीकृति (अनु. 200): साधारण विधेयक को राज्यपाल स्वीकृत, अस्वीकृत, पुनर्विचार के लिए अथवा राष्ट्रपति के विचारार्थ भेज सकता है। पुनर्विचार के लिए भेजे गए विधेयक को यदि दोनों सदनों द्वारा पुनः पारित कर दें, तो राज्यपाल को उस पर स्वीकृति देनी पड़ेगी।","विधेयक पर राष्ट्रपति की स्वीकृति (अनु. 201): किसी साधारण विधेयक को राज्यपाल द्वारा अपने स्वविवेक से राष्ट्रपति के विचार भेजा जाता है। राष्ट्रपति स्वीकृत, अस्वीकृत अथवा पुनर्विचार के लिए भेज सकता है। राष्ट्रपति द्वारा पुनर्विचार के लिए भेजे गए विधेयक को यदि विधानमण्डल पुनः पारित कर दे तो राष्ट्रपति उस पर स्वीकृति देने हेतु बाध्य नहीं है।","धन विधेयक: केवल विधानसभा में ही पेश किए जा सकते हैं। कोई विधेयक धन विधेयक है या नहीं, इसका निर्णय स्पीकर करता है। विधानसभा द्वारा पारित धन विधेयक को विधानपरिषद अधिकतम 14 दिन तक रोक सकती है। इसके उपरांत यह विधेयक ठीक वैसे ही पारित हो जाता है जैसा कि विधानसभा ने इसे पारित किया था।","Note: धन विधेयक को राज्यपाल स्वीकृत अथवा अस्वीकृत या राष्ट्रपति के विचारार्थ भेज सकता है लेकिन पुनर्विचार के लिए नहीं लौटा सकता है।"]],
["योग्यता और अयोग्यता",["अनु. 173 – योग्यता: (1) भारत का नागरिक हो। (2) विधानसभा के लिए न्यूनतम आयु 25 वर्ष व विधानपरिषद के लिए 30 वर्ष आयु पूर्ण कर चुका हो। (3) वह समस्त योग्यताएँ जो संसद विधि बनाकर निर्धारित करें।","अयोग्यताएँ – अनु. 191: (1) यदि भारत का नागरिक न हो। (2) मानसिक विकृति, दिवालिया आदि घोषित किया जा चुका हो। (3) वे समस्त अयोग्यताएँ जो संसद विधि बनाकर निर्धारित करे। (4) दल बदल सम्बन्धी अयोग्यता।","Note: विधानमण्डल के सदस्यों की दल-बदल को छोड़कर अन्य सभी प्रकार की अयोग्यताओं के विवाद का निर्णय राज्यपाल भारतीय चुनाव आयोग की सलाह से करेगा। [अनु. 192]"]]
]],
["📣","लोकनीति",[
["अर्थ और लोकप्रशासन",["लोकनीति का अर्थ: सामान्य शब्दों में लोकनीति क्या किया जाए? कैसे किया जाए? कब किया जाए? और कहाँ किया जाए? का ही सार रूप है।","सरकार द्वारा जनता के लिए बनायी गयी नीति लोकनीति है।","लोकप्रशासन: लोकनीति की प्रक्रिया तथा उसकी क्रियान्वयन को ही लोकप्रशासन कहा जाता है।"]],
["विद्वानों के कथन",["हिल: लोकनीति राजनीतिक प्रभावों का फल है जो यह निर्धारित करता है कि नीति निर्माण एवं क्रियान्वयन में राज्य की क्या सीमाएँ हैं।","प्रो. L.D. व्हाइट: सार्वजनिक नीति का प्रबंधन एवं क्रियान्वयन ही लोकप्रशासन है।","पीटर ओके गार्ड: लोकनीति व प्रशासन राजनीति के जुड़वा बच्चे हैं जो एक दूसरे से अलग नहीं किए जा सकते।","वाईल्ड: लोकसेवकों के द्वारा लोकनीति का उद्देश्य प्राप्त करने के लिए किया गया प्रबंध है।","थॉमस आर डाई: लोकनीति वह सब कुछ है जो सरकार को करने तथा नहीं करने की प्रेरणा देती है।","पेलोडन: किसी देश की सरकार के प्रत्येक स्तर पर नीतियों का निर्माण किया जाता है, वास्तव में वो सब ही लोकनीति है।","टैरी: लोकनीति उस कार्यवाही की शाब्दिक लिखित व विहित बुनियादी मार्गदर्शक है जिसे प्रबंधक अपनाता है तथा उसका अनुगमन करता है। पुस्तक – प्रिंसिपल ऑफ मैनेजमेंट।","बीमॉक: लोकनीति सजगता से निर्धारित आचरण के वह नियम है जो प्रशासनिक निर्णयों को मार्ग दिखाते हैं।","पॉल जे फ्रेडरिक: इस परिस्थिति में क्या करना है या क्या नहीं करना के सम्बन्ध में किए गए निर्णय ही लोकनीति कहलाती है।"]],
["लक्षण, गठन और अंग",["लोकनीति के लक्षण/विशेषताएँ: उद्देश्य सहित निर्मित होती है; सकारात्मक/नकारात्मक; गतिविधियों का एक सतत व निश्चित क्रम; लोकनीति देश के सामान्य कानून अर्थात् संविधान पर आधारित होती है, अतः इसे वैधानिक शक्ति प्राप्त है; यह वह लोकनीति का स्वरूप है जो सरकार प्रदान करती है।","लोकनीति का गठन – संवैधानिक रूप: कार्यपालिका (P.M., राष्ट्रपति); व्यवस्थापिका (संसद); न्यायपालिका (सर्वोच्च न्यायालय)।","असंवैधानिक रूप से – सरकारी रूप: योजना आयोग, राष्ट्रीय विकास परिषद। गैर सरकारी: दबाव समूह, दल, NGO।","भारत में लोकनीति निर्माण के अंग: संविधान, विधानमण्डल, मंत्रीपरिषद, योजना आयोग, राष्ट्रीय विकास परिषद, न्यायपालिका, राजनीतिक दल, दबाव समूह, व्यावसायिक सभाएँ।"]],
["इतिहास और निर्माण प्रक्रिया",["1894 → भारत की प्रथम औपचारिक नीति → राष्ट्रीय वन नीति","1922 → प्रथम बार लोक प्रशासन का अध्ययन","1937 → अमेरिका हार्वर्ड विश्वविद्यालय लोकप्रशासन स्नातकीय पाठ्यक्रम में लोकनीति को शामिल किया गया।","1956 → लोकनीति के क्रियान्वयन के अध्ययन की शुरुआत हेराल्ड लॉसबेल द्वारा की गयी।","लोकनीति निर्माण की प्रक्रिया: (1) समस्या की पहचान (2) मंत्रीमण्डल द्वारा रूपरेखा निर्माण (3) विशेषज्ञ संस्थाओं का गठन निर्माण (4) व्यापक रूपरेखा का निर्माण (5) ड्राफ्ट नीति का प्रकाशन (6) केबिनेट द्वारा संसद तथा विधानमण्डल में पेश (7) सक्षम अधिकारी अथवा विधानमण्डल द्वारा स्वीकृति (8) अंतिम रूप से तैयार नीति घोषित।","भारत में लोकनीति निर्माण की समस्याएँ: विश्वसनीय तथ्यों व आंकड़ों की कमी; कमजोर प्रबंध/सूचना तंत्र; जन सहयोग की कमी; सामान्यज्ञों का वर्चस्व कम होना; विशेषज्ञों के ज्ञान का सम्पूर्ण उपयोग नहीं लेना।"]],
["लोकनीति के प्रकार",["विषय वस्तु के आधार पर: (1) आर्थिक लोकनीति (2) सामाजिक लोकनीति (3) राजनीतिक लोकनीति (4) सुरक्षा।","तकनीकी के आधार पर: सारगर्भिक/तथ्यात्मक; वितरण से संबंधी; पुनः वितरणात्मक; नियंत्रण; पंजीकरण; क्षेत्र से सम्बन्धित।","क्षेत्र विशेष: किसी क्षेत्र विशेष के लिए बनायी गयी नीति – डांग क्षेत्र कार्यक्रम, मगरा विकास कार्यक्रम।","सारगर्भिक/मूलभूत नीतियां: पूरे समाज की कल्याण हेतु बनायी गयी नीतियां जो पूरे समाज को प्रभावित करे। जैसे – शिक्षा, समाजसेवा, स्वास्थ्य।","नियंत्रण नीतियां: ऐसी लोकनीति जो नियंत्रण स्थापित करने के लिए बनायी जाती हो। Ex. RBI, SEBI","वितरण से संबंधी नीतियां: किसी वर्ग विशेष के लिए बनायी गयी नीतियां अर्थात् जो एक वर्ग विशेष को सशक्त बनाता हो। जैसे – महिलाओं की सुरक्षा, बच्चों की सुरक्षा।","पुनः वितरणात्मक नीति: लोकनीति को पुनः स्थापित करना अर्थात् पहले चलायी गयी लोकनीति का एक दूसरे स्वरूप में पुनः प्रारम्भ। Ex. मिशन इन्द्रधनुष 2.0"]],
["विधिक अधिकार",["विधिक अधिकार, नैतिक अधिकारों व मूल अधिकारों से अलग होते हैं क्योंकि विधिक अधिकारों के लिए राज्य की मान्यता व प्रवर्तनीयता आवश्यक होती है।","इहरिंग के अनुसार: अधिकार विधि द्वारा संरक्षित होते हैं।","ऑमण्ड के अनुसार: अधिकार विधि के नियम या शासन द्वारा मान्य व सुरक्षित हित है।","Note: आम नागरिकों से संबंधित कुछ प्रमुख विधिक अधिकार: (1) राज. लोकसेवा गारंटी अधिनियम 2011 (2) राज. जनसुनवाई का अधिकार अधिनियम 2012 (3) उपभोक्ता संरक्षण अधिनियम 1986 (4) सूचना का अधिकार अधिनियम 2005 (5) महात्मा गांधी राष्ट्रीय रोजगार गारंटी अधिनियम (मनरेगा) (6) नि:शुल्क एवं अनिवार्य शिक्षा के अधिकार अधिनियम 2009 (7) खाद्य सुरक्षा अधिनियम 2013 (8) प्रसव पूर्व निदान तकनीकी अधिनियम 1994"]],
["राज. लोकसेवा गारंटी अधिनियम 2011",["सम्पूर्ण भारत में लोकसेवा गारंटी अधिनियम सर्वप्रथम मध्यप्रदेश द्वारा 18 अगस्त 2010 को लागू किया गया।","राज. सरकार द्वारा अधिनियम 14 नवम्बर 2011 को मुख्यमंत्री अशोक गहलोत द्वारा सम्पूर्ण राज्य में लागू किया गया।","ये ऐसा अधिनियम है जो राज्य की जनता को निर्धारित समय सीमा में सेवाएँ प्रदान करने की गारंटी प्रदान करता है। इसमें आमजन की सक्रिय भागीदारी व कर्मचारी तथा अधिकारी समय सेवा प्रदान के लिए बाध्य है।","प्रारम्भिक चरण में 15 विभागों की 108 सेवाएँ जनता को उपलब्ध करवायी गयी। वर्तमान समय में इसे बढ़ाकर 18 विभाग की 153 सेवाओं को शामिल किया गया। सरकार द्वारा प्रस्तावित योजना के तहत आगामी समय में कुल 25 विभागों की कुल 200 सेवाएँ प्रस्तावित हैं।"]],
["प्रमुख उद्देश्य",["(1) सरकारी अधिकारियों में भ्रष्टाचार को कम करना तथा पारदर्शिता व लोकजवाबदेयता में वृद्धि करना।","(2) जन समस्याओं का त्वरित समाधान होना।","(3) जनता को प्रभावी शिकायत निवारण तंत्र उपलब्ध करवाना।","(4) प्रशासन में सेवा प्रदान करने में आम जन व लोकसेवकों की सक्रिय भागीदारी प्रदान करना।","(5) प्रशासन व लोक सेवा में प्रतिबद्धता, समयबद्धता, कार्यकुशलता सुनिश्चित करना।","(6) लोगों को सेवा प्रदान करने का विधिक अधिकार प्रदान करना।"]],
["प्रमुख प्रावधान",["इसमें 18 विभाग की 153 सेवाओं को उपलब्ध करवाया जाएगा जो दिन प्रतिदिन की गतिविधियों से संबंधित हैं तथा सेवाओं से संबंधित सूचना Notice Board पर प्रकाशित की जाएगी।","व्यक्ति द्वारा सेवा प्राप्त करने के लिए संबंधित कर्मचारी को आवेदन करेगा तथा संबंधित कर्मचारी से आवेदन की रसीद प्राप्त करेगा।","Note: प्राप्त रसीद में अधिकारी द्वारा समय सीमा का उल्लेख किया जाएगा।","संबंधित अधिकारी निश्चित समय सीमा में या तो सेवा उपलब्ध कराएगा या आवेदन को नामंजूर कर देगा। आवेदन को नामंजूर करने या सेवा प्रदान करने में हुए विलम्ब का कारण बताना होगा।","संबंधित समय पर सेवा प्राप्त नहीं होती अथवा आवेदन नामंजूर हो जाता है तो इसके विरुद्ध 30 दिन के भीतर प्रथम अपील अधिकारी को शिकायत दर्ज करवायी जाती है।","संबंधित प्रथम अपील अधिकारी 21 दिन के भीतर शिकायत का निस्तारण करेगा।","प्रथम अपील अधिकारी के निर्णय के विरुद्ध 60 दिन के भीतर दूसरे अपील अधिकारी को शिकायत दर्ज की जाएगी।","संबंधित दूसरा अपील अधिकारी मामलों की जांच करके दोषी कर्मचारियों के विरुद्ध दण्ड आरोपित करता है जो 500 रु. से लेकर 5 हजार रुपये तक हो सकता है।","Note: यदि सेवा प्रदान करने में कोई कर्मचारी या अधिकारी अनावश्यक विलम्ब करे तो प्रतिदिन 250 रुपये का जुर्माना लगाया जा सकता, जो अधिकतम 5 हजार रुपये होगा।"]]
]]
);
NOTES=NOTES.concat([["🏢", "राज्य मंत्रीपरिषद", [["परिचय (अनु. 163)", ["राज्य मंत्रीपरिषद राज्य में वास्तविक कार्यपालिका होती है।", "अनु. 163(1): राज्यपाल के विवेकाधीन प्रावधानों के अतिरिक्त उसकी सहायता हेतु एक मंत्रीपरिषद होगी, जिसका प्रधान मुख्यमंत्री होगा।", "अनु. 163(2): विवेकाधीन प्रावधानों के तहत राज्यपाल द्वारा लिए गए निर्णयों को न्यायालय में चुनौती नहीं दी जा सकती।", "अनु. 163(3): इस बात की न्यायिक जाँच नहीं होगी कि मंत्रीपरिषद ने राज्यपाल को सलाह दी या नहीं, और यदि दी तो क्या सलाह दी।"]], ["मंत्रियों की नियुक्ति (अनु. 164(1))", ["मुख्यमंत्री की नियुक्ति राज्यपाल करेगा तथा अन्य मंत्रियों की नियुक्ति राज्यपाल मुख्यमंत्री की सलाह से करेगा।", "इसका तात्पर्य है कि नियुक्ति में राज्यपाल स्वविवेक का प्रयोग नहीं कर सकता; वह उसी व्यक्ति को मंत्री बनाएगा जिसके बारे में मुख्यमंत्री सलाह देगा।", "संविधान में मंत्रियों की योग्यता का उल्लेख नहीं है, लेकिन अपेक्षा की गई है कि मंत्री विधानमंडल के किसी सदन के सदस्य होंगे।", "नियुक्ति के समय मंत्री का विधानमंडल का सदस्य होना आवश्यक नहीं, लेकिन नियुक्ति तिथि से 6 माह में किसी सदन की सदस्यता ग्रहण करना अनिवार्य है।", "अर्थात् कोई मंत्री विधानमंडल का सदस्य बने बिना अधिकतम 6 माह तक मंत्री पद पर रह सकता है।", "अनु. 164(4): जो मंत्री लगातार 6 माह तक विधानमंडल के सदस्य नहीं होंगे, वे इस अवधि के बाद मंत्री नहीं रहेंगे।", "अनु. 164(1): इन 4 राज्यों में अनुसूचित जनजाति कल्याण का प्रभार साधक मंत्री होना ज़रूरी है: 1. मध्यप्रदेश  2. उड़ीसा  3. छत्तीसगढ़  4. झारखण्ड।"]], ["पदच्युति, उत्तरदायित्व, शपथ, वेतन", ["अनु. 164(1) पदच्युति: मंत्री राज्यपाल के प्रसादपर्यन्त पद पर रहेगा, अर्थात् राज्यपाल किसी मंत्री को बिना कारण बताए हटा सकता है।", "प्रत्येक मंत्री व्यक्तिगत रूप से राज्यपाल के प्रति उत्तरदायी होता है।", "चूँकि राज्यपाल इस शक्ति का प्रयोग मुख्यमंत्री की सलाह से करता है, अतः व्यवहारिक रूप से प्रत्येक मंत्री मुख्यमंत्री के नियंत्रण में रहता है।", "अनु. 164(2) सामूहिक उत्तरदायित्व: मंत्रीपरिषद सामूहिक रूप से विधानसभा के प्रति उत्तरदायी होगी।", "अनु. 164(3) शपथ: मंत्री राज्यपाल के समक्ष पद और गोपनीयता की शपथ ग्रहण करते हैं। मंत्रियों की शपथ का प्रारूप तीसरी अनुसूची में है।", "अनु. 164(5) वेतन-भत्ते: मंत्री राज्य विधानमंडल द्वारा निर्धारित मात्रा में वेतन-भत्ते प्राप्त करते हैं।"]], ["मंत्रीपरिषद की संरचना", ["मुख्यमंत्री के अतिरिक्त मुख्यतः तीन प्रकार के मंत्री होते हैं: 1. मंत्रिमंडल (कैबिनेट)  2. राज्य मंत्री  3. उपमंत्री।", "मंत्रिमंडल (कैबिनेट): ये सबसे ताकतवर मंत्री होते हैं, जो अपने विभाग के मुखिया होते हैं।", "राज्य मंत्री: ये दूसरे स्तर के मंत्री होते हैं, जो कैबिनेट मंत्री के अधीन रहकर उनका सहयोग करते हैं।", "जिस विभाग में कैबिनेट मंत्री नहीं होता, उस विभाग के राज्य मंत्री के पास उस विभाग का स्वतंत्र प्रभार होता है।", "उपमंत्री: ये तीसरे स्तर के मंत्री होते हैं, जो उपरोक्त दोनों के अधीन रहकर काम करते हैं।", "Note: संसदीय सचिव मंत्रीपरिषद का हिस्सा नहीं होते। संसदीय सचिव की नियुक्ति मुख्यमंत्री करता है और वे मुख्यमंत्री के समकक्ष ही शपथ ग्रहण करते हैं।"]], ["मंत्रीपरिषद का आकार और दलबदल", ["मूल संविधान में मंत्रियों की अधिकतम तथा न्यूनतम संख्या का निर्धारण नहीं किया गया था।", "91वाँ संविधान संशोधन 2003 द्वारा अनु. 164(1क) जोड़कर प्रावधान किया गया कि मुख्यमंत्री सहित मंत्रियों की अधिकतम संख्या विधानसभा की कुल सदस्य संख्या के 15% से अधिक नहीं होगी।", "मुख्यमंत्री सहित यह संख्या 12 से भी कम नहीं होगी।", "इस आधार पर मंत्रीपरिषद में मुख्यमंत्री सहित अधिकतम संख्या 30 हो सकती है।", "दलबदल: 91वाँ संविधान संशोधन 2003 द्वारा अनु. 164(1ख) जोड़ा गया। दलबदल करने पर मंत्री मंत्रीपद के लिए अयोग्य होगा।"]]]], ["📜", "मौलिक कर्तव्य", [["परिचय", ["मूल संविधान में मौलिक कर्तव्यों का कोई उल्लेख नहीं किया गया था।", "सरदार स्वर्ण सिंह समिति की सिफारिश पर 42वाँ संविधान संशोधन द्वारा संविधान में भाग IV-A जोड़कर उसमें अनु. 51-A जोड़ा गया, जिसके अंतर्गत 10 मौलिक कर्तव्य शामिल किए गए।", "86वाँ संविधान संशोधन 2002 द्वारा 11वाँ मौलिक कर्तव्य जोड़ा गया।", "मौलिक कर्तव्य वाद योग्य नहीं होते, अर्थात् ये न्यायालय द्वारा प्रवर्तनीय नहीं होते।", "संविधान में स्पष्ट उल्लेख नहीं है, लेकिन सर्वोच्च न्यायालय के निर्णयानुसार ये वाद योग्य नहीं हैं; फिर भी संविधान की व्याख्या करते समय ये महत्वपूर्ण भूमिका निभाते हैं।", "Note: मौलिक कर्तव्य केवल नागरिकों के लिए निर्धारित हैं, विदेशियों के लिए नहीं।"]], ["अनु. 51-A: भारत के प्रत्येक नागरिक का कर्तव्य", ["(क): संविधान का पालन करे तथा उसके आदर्शों, संस्थाओं, राष्ट्रध्वज और राष्ट्रगान का सम्मान करे।", "(ख): स्वतंत्रता के लिए राष्ट्रीय आन्दोलन को प्रेरित करने वाले उच्च आदर्शों को हृदय में संजोए रखे।", "(ग): भारत की संप्रभुता, एकता और अखण्डता की रक्षा करे तथा उसे अक्षुण्ण बनाए रखे।", "(घ): देश की रक्षा करे तथा आह्वान किए जाने पर राष्ट्र की सेवा हेतु तत्पर रहे।", "(ङ): सम्मान, भ्रातृत्व तथा समरसता के भाव का विकास करे जो जातिगत भेदभाव से परे हो तथा ऐसी कुप्रथाओं का त्याग करे जो महिलाओं की गरिमा के विरुद्ध हों।", "(च): हमारी सामासिक संस्कृति की गौरवशाली परम्परा का महत्व समझे तथा उसका परिरक्षण करे।", "(छ): प्राकृतिक पर्यावरण, जिसमें वन, झील, नदी तथा वन्य जीव शामिल हैं, का संरक्षण करे तथा प्राणिमात्र के प्रति दया भाव रखे।", "(ज): वैज्ञानिक दृष्टिकोण, मानववाद, ज्ञानार्जन तथा निरन्तर सुधार की भावना का विकास करे।", "(झ): सार्वजनिक संपत्ति को सुरक्षित रखे तथा हिंसा से दूर रहे।", "(ञ): व्यक्तिगत और सामूहिक गतिविधियों के सभी क्षेत्रों में उत्कर्ष की तरफ बढ़ने का प्रयास करे जिससे कि राष्ट्र उपलब्धियों की नई ऊँचाइयाँ छू सके।", "(ट): माता-पिता अथवा अभिभावकों का कर्तव्य है कि अपने 6 से 14 वर्ष के बच्चों को शिक्षा प्राप्त करने के अवसर प्रदान करें।"]], ["जे. एस. वर्मा समिति - 1999", ["मौलिक कर्तव्यों के संबंध में इस समिति का गठन 1999 में किया गया।", "सिफारिश (i): 3 जनवरी को राष्ट्रीय कर्तव्य दिवस के रूप में घोषित किया जाए, क्योंकि 42वाँ संविधान संशोधन 3 जनवरी 1977 को प्रभावी हुआ था, जिसके परिणामस्वरूप मौलिक कर्तव्य 3 जनवरी 1977 को लागू हुए थे।", "सिफारिश (ii): विद्यालयों तथा सार्वजनिक स्थलों पर मौलिक कर्तव्यों का अंकन किया जाना चाहिए, ताकि लोगों को इनके प्रति जागरूक किया जा सके।", "सिफारिश (iii): मौलिक कर्तव्यों को पाठ्यक्रम में शामिल किया जाना चाहिए तथा शिक्षकों को इस संबंध में आवश्यक प्रशिक्षण दिया जाना चाहिए।", "सिफारिश (iv): मीडिया द्वारा ऐसे कार्यक्रम प्रस्तुत किए जाने चाहिए जिनसे मौलिक कर्तव्यों का प्रचार-प्रसार हो।"]]]], ["🎖️", "राज्यपाल", [["संवैधानिक ढाँचा", ["भाग - VI | अनुच्छेद 152-237 | राज्य सरकार", "अध्याय I: अनु. 152 - राज्य की परिभाषा।", "अध्याय II: अनु. 153-167 - राज्य की कार्यपालिका।", "अध्याय III: अनु. 168-212 - राज्य विधानमण्डल।", "अध्याय IV: अनु. 213 - अध्यादेश।", "अध्याय V: अनु. 214-232 - उच्च न्यायालय।", "अध्याय VI: अनु. 233-237 - अधीनस्थ न्यायालय।"]], ["अनु. 153 से 160", ["अनु. 153: प्रत्येक राज्य का एक राज्यपाल होगा।", "अनु. 154: राज्य की समस्त कार्यपालिका शक्ति राज्यपाल में निहित होगी, जिसका प्रयोग वह स्वयं अथवा अपने अधीनस्थ के माध्यम से करेगा।", "Note: सातवें संविधान संशोधन, 1956 द्वारा यह प्रावधान किया गया कि एक व्यक्ति दो या दो से अधिक राज्यों का राज्यपाल हो सकता है।", "अनु. 155 नियुक्ति: राज्यपाल की नियुक्ति राष्ट्रपति करता है। किसी राज्य के निवासी को उसी राज्य का राज्यपाल नहीं बनाया जाता।", "अनु. 156 कार्यकाल: राज्यपाल राष्ट्रपति के प्रसादपर्यन्त पद पर रहता है। वह राष्ट्रपति को सम्बोधित त्यागपत्र से समय से पूर्व भी पद छोड़ सकता है। इन दोनों प्रावधानों के अधीन उसका कार्यकाल 5 वर्ष होता है। राज्यपाल नए राज्यपाल के पद ग्रहण करने तक पद पर बना रहता है।", "अनु. 157 योग्यताएँ: (1) भारत का नागरिक हो। (2) 35 वर्ष की आयु पूर्ण कर चुका हो।", "अनु. 158 पद हेतु शर्तें: (1) सांसद या विधायक के राज्यपाल बनने पर उसे शपथ ग्रहण से पूर्व अपने पूर्व पद से त्यागपत्र देना होगा, अन्यथा शपथ ग्रहण के साथ ही उसका पूर्व पद स्वतः रिक्त हो जाता है। (2) राज्यपाल को संसद द्वारा निर्धारित मात्रा में वेतन देय होगा, जो राज्य की संचित निधि पर भारित होता है, तथा उसके वेतन में किसी प्रकार की कटौती नहीं की जा सकती।", "अनु. 159 शपथ: राज्यपाल उस राज्य के उच्च न्यायालय के मुख्य न्यायाधीश अथवा उनकी अनुपस्थिति में वरिष्ठतम न्यायाधीश के समक्ष शपथ ग्रहण करता है।", "Note: राज्यपाल की शपथ के प्रारूप का वर्णन तीसरी अनुसूची में नहीं है।", "अनु. 160 आकस्मिक रिक्ति: राज्यपाल का पद आकस्मिक रूप से रिक्त होने की स्थिति में राष्ट्रपति द्वारा निर्धारित व्यक्ति उसके पद के कर्तव्यों का निर्वहन करता है।"]], ["राज्यपाल के विशेषाधिकार (अनु. 361)", ["(1) राज्यपाल अपने किसी कर्तव्य के लिए किसी भी न्यायालय के प्रति उत्तरदायी नहीं होता।", "(2) किसी भी न्यायालय द NOTES=NOTES.concat([["⚖️", "नीति निदेशक तत्व", [["परिचय", ["भाग IV | अनु. 36-51 | स्रोत: आयरलैंड का संविधान।", "संविधान निर्माण के समय बी.एन. राव ने मौलिक अधिकारों को दो श्रेणियों में बाँटा: पहली श्रेणी न्यायालय द्वारा प्रवर्तनीय, दूसरी श्रेणी न्याय योग्य नहीं, पर राज्य सामर्थ्य होने पर इस दिशा में कार्य करेगा। दूसरी श्रेणी को नीति-निदेशक तत्व के रूप में भाग IV में शामिल किया गया।", "नीति-निदेशक तत्व राज्य को दिए गए ऐसे निर्देश हैं जो जनहित तथा लोक कल्याण के उद्देश्य की पूर्ति हेतु दिए जाएँगे; इनकी अनुपालना कब होगी, इसके लिए राज्य बाध्य नहीं है।", "ये वाद योग्य नहीं हैं, अर्थात् राज्य कार्य न करे तो न्यायालय में कोई दावा नहीं किया जा सकता।", "ऐसा इसलिए किया गया क्योंकि इनमें दिए कार्यों का विस्तार अत्यधिक व्यापक है और नव-स्वतंत्र भारत के लिए संभव नहीं था; अतः इन्हें बाध्यकारी नहीं बल्कि राज्य की इच्छा पर छोड़ा गया।"]], ["विशेषताएँ", ["(1) न्याय योग्य नहीं होते, वाद योग्य नहीं होते।", "(2) कल्याणकारी राज्य का समर्थन करते हैं।", "(3) प्रकृति सकारात्मक है, अर्थात् राज्य को कार्य करने के लिए प्रेरित करते हैं।", "(4) स्वतः लागू नहीं होते, राज्य द्वारा लागू करना पड़ता है।", "(5) बाध्यकारी नहीं; लागू करना राज्य की इच्छा पर निर्भर।", "(6) सामूहिक हित पर आधारित होते हैं।"]], ["महत्वपूर्ण टिप्पणियाँ", ["टी.टी. कृष्णामाचारी: भावनाओं का कूड़ाघर।", "आइवर जेनिंग्स: पुण्यात्माएँ, नैतिक आकांक्षाएँ।", "के.टी. शाह: ऐसे चेक के समान, जिसके भुगतान की तिथि बैंक की इच्छा पर छोड़ दी गई।", "भीमराव अम्बेडकर: सामाजिक और आर्थिक लोकतंत्र की स्थापना करने में सहायक।", "के.सी. व्हीयर: कार्यपालिका और न्यायपालिका के बीच संघर्ष को बढ़ावा देते हैं।", "एम.सी. छागला: यदि पूर्णतः लागू कर दिया जाए तो भारत की धरती पर ही स्वर्ग की स्थापना हो जायेगी।"]], ["मौलिक अधिकार और नीति-निदेशक में अन्तर", ["बिंदु | मौलिक अधिकार | नीति-निदेशक", "वाद योग्यता | वाद योग्य | वाद योग्य नहीं", "प्रकृति | नकारात्मक | सकारात्मक", "आधार | व्यक्तिगत हित | सामूहिक हित", "लोकतंत्र | राजनीतिक | सामाजिक-आर्थिक", "लागू होना | स्वतः लागू | स्वतः लागू नहीं"]], ["संघर्ष और प्रमुख वाद", ["संविधान लागू होते ही विवाद रहा कि दोनों में अधिक
