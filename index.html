 नीति-निदेशक तत्व", ["42वाँ संशोधन 1976: अनु. 39(च) बच्चों के लिए स्वतंत्र एवं गरिमामय वातावरण | अनु. 39A समान न्याय एवं निःशुल्क विधिक सहायता | अनु. 43A उद्योगों के प्रबन्धन में कार्मिकों की भागीदारी | अनु. 48A पर्यावरण संरक्षण तथा वन एवं वन्य जीवों की सुरक्षा।", "44वाँ संशोधन 1978: अनु. 38(2) आय की असमानताओं को कम करने का प्रयास।", "86वाँ संशोधन 2002: अनु. 45 में 0-6 वर्ष तक के बच्चों की उचित देखभाल तथा शिक्षा की व्यवस्था (भाषा में परिवर्तन)।", "97वाँ संशोधन 2011: अनु. 43B सहकारी समितियों का गठन एवं विकास।"]], ["अनु. 38 से 51", ["अनु. 38: राज्य लोककल्याण की अभिवृद्धि करेगा। 38(1): ऐसी सामाजिक व्यवस्था स्थापित करेगा जिसमें सामाजिक, आर्थिक और राजनीतिक न्याय की स्थापना हो। 38(2): आय की असमानताओं को कम करने का प्रयास करेगा [44वाँ - 1978]।", "अनु. 39: राज्य अपनी नीतियों का संचालन इस प्रकार करेगा कि: (क) स्त्री-पुरुषों के लिए आजीविका के पर्याप्त साधन (ख) समाज के भौतिक संसाधनों का सामूहिक हित में उपयोग (ग) धन के अहितकारी संकेन्द्रण पर रोक (घ) समान कार्य के लिए समान वेतन (ङ) स्त्री-पुरुष कामिकों की शक्ति तथा स्वास्थ्य और बच्चों की सुकुमार अवस्था के दुरुपयोग पर रोक (च) बच्चों के लिए स्वतंत्र एवं गरिमामय वातावरण।", "अनु. 39A: समान न्याय एवं निःशुल्क विधिक सहायता [42वाँ 1976]।", "अनु. 40: पंचायतों का गठन एवं उनका विकास।", "अनु. 41: राज्य काम पाने, शिक्षा पाने तथा कुछ दशाओं में (बीमार, बेरोजगारी, बुढ़ापा और निशक्तता) लोक सहायता पाने का अधिकार प्रदान करने का प्रयास करेगा।", "अनु. 42: काम की न्यायसंगत तथा मानवोचित दशाएँ स्थापित करने तथा प्रसुति सहायता उपलब्ध कराने का प्रयास।", "अनु. 43: कामिकों के लिए निर्वाह मजदूरी तथा कुटीर उद्योगों का विकास।", "अनु. 43A: उद्योगों के प्रबन्धन में कार्मिकों की भागीदारी [42वाँ 1976]।", "अनु. 43B: सहकारी समितियों का गठन एवं विकास [97वाँ 2011]।", "अनु. 44: समान नागरिक संहिता।", "अनु. 45: 0-6 वर्ष तक के बच्चों की उचित देखभाल तथा शिक्षा की व्यवस्था [86वाँ 2002]।", "अनु. 46: अनुसूचित जाति तथा जनजाति तथा दुर्बल वर्गों के लिए शिक्षा तथा अर्थ के क्षेत्र में विकास हेतु प्रावधान।", "अनु. 47: पोषाहार के स्तर तथा जीवन स्तर को ऊँचा करने तथा लोक स्वास्थ्य को सुधारने का प्रयास तथा मादक और नशीले पदार्थों के सेवन का निषेध।", "अनु. 48: कृषि और पशुपालन का आधुनिक तरीके से संगठन करने का प्रयास तथा गाय व बछड़ों और दुधारु व वाहक पशुओं की नस्ल सुधारने तथा वध निषेध का प्रयास।", "अनु. 48A: पर्यावरण संरक्षण तथा वन और वन्य जीवों की सुरक्षा [42वाँ 1976]।", "अनु. 49: राष्ट्रीय महत्व के स्मारकों, वस्तुओं तथा स्थानों का संरक्षण।", "अनु. 50: कार्यपालिका से न्यायपालिका का पृथक्करण।", "अनु. 51: अन्तर्राष्ट्रीय नीतियों का शान्तिपूर्ण एवं सद्भावनापूर्ण तरीके से प्रयोग करते हुए संधियों और समझौतों का निर्वहन करना। इस अनु. में भारत की विदेश नीति परिलक्षित होती है।"]], ["भाग IV के अलावा अन्य हिस्सों में", ["अनु. 335: आरक्षण के प्रावधान करते समय राज्य इस बात का विशेष ध्यान रखेगा कि इससे राज्य की प्रशासनिक कुशलता पर कोई विपरीत प्रभाव न पड़े।", "अनु. 350क: प्राथमिक शिक्षा मातृभाषा में देने का प्रयास।", "अनु. 351: हिन्दी भाषा का प्रसार करने का प्रयास।"]]]], ["👔", "प्रधानमंत्री", [["अनु. 74 और 75", ["अनु. 74(1): राष्ट्रपति की सहायता और परामर्श के लिये एक मंत्रिपरिषद होगी जिसका प्रधान प्रधानमंत्री होगा; अर्थात् संविधान में प्रधानमंत्री को मंत्रिपरिषद के मुखिया के रूप में परिभाषित किया गया है।", "संसदीय शासन प्रणाली में कार्यपालिका दो प्रकार की होती है: नाममात्र की कार्यपालिका - राष्ट्रपति; वास्तविक कार्यपालिका - प्रधानमंत्री + मंत्रिपरिषद।", "संसदीय कार्यप्रणाली को मंत्रिमण्डलीय शासन अथवा प्रधानमन्त्रीय शासन भी कहा जाता है।", "अनु. 75(1): प्रधानमंत्री की नियुक्ति राष्ट्रपति करेगा। संविधान में नहीं लिखा कि किसे नियुक्त करेगा, लेकिन ब्रिटेन के वेस्टमिनिस्टर मॉडल का अनुसरण करते हुए राष्ट्रपति बहुमत दल के नेता को प्रधानमंत्री नियुक्त करता है। किसी दल अथवा गठबंधन को लोकसभा में बहुमत न होने पर राष्ट्रपति स्वविवेक से प्रधानमंत्री का चयन करता है।", "संविधान में प्रधानमंत्री पद के लिये योग्यताओं का उल्लेख नहीं है, लेकिन अपेक्षा की गई है कि वह किसी सदन का सदस्य होगा।", "नियुक्ति के समय संसद का सदस्य होना आवश्यक नहीं, लेकिन नियुक्ति तिथि से 6 माह में किसी एक सदन का सदस्य होना आवश्यक होगा; अर्थात् सदस्य बिना अधिकतम 6 माह तक पद पर रह सकता है।", "ऐसे प्रधानमंत्री जो नियुक्ति के समय संसद के किसी भी सदन के सदस्य नहीं थे: 1. पी.वी. नरसिम्हाराव - लोकसभा  2. एच.डी. देवगौड़ा - राज्यसभा।"]], ["ब्रिटिश प्रधानमंत्री से तुलना", ["भारतीय प्रधानमंत्री का पद ब्रिटिश प्रधानमंत्री से समानता रखता है, लेकिन दोनों पदों में असमानता भी है।", "ब्रिटिश प्रधानमंत्री के लिये निम्न सदन (हाउस ऑफ कॉमन्स) का सदस्य होना आवश्यक है, जबकि भारत का प्रधानमंत्री लोकसभा अथवा राज्यसभा किसी भी सदन का सदस्य हो सकता है।", "राज्यसभा के सदस्य रहे प्रधानमंत्री: 1. इन्दिरा गांधी  2. एच.डी. देवगौड़ा  3. इन्द्रकुमार गुजराल  4. मनमोहन सिंह।", "सदन के नेता के रूप में: दोनों सदनों में सदन के नेता का पद होता है जो सत्तापक्ष से सम्बन्धित होता है; प्रधानमंत्री उस सदन का नेता होता है जिसका वह सदस्य होता है।", "लोकसभा के बहुमत दल के नेता के रूप में: प्रधानमंत्री चाहे संसद के किसी भी सदन का सदस्य हो अथवा न हो, वह अनिवार्यतः लोकसभा में बहुमत दल का नेता होता है।"]], ["कर्तव्य (अनु. 78) और मंत्रिपरिषद में स्थिति", ["अनु. 78: (क) संघ सरकार के प्रशासनिक और विधायी मामलों पर मंत्रिपरिषद के विनिश्चय की सूचना राष्ट्रपति को देगा। (ख) इन मामलों से संबंधित जो जानकारी राष्ट्रपति माँगे वह उसे दे। (ग) किसी विषय पर किसी मंत्री ने विनिश्चय कर लिया हो लेकिन मंत्रिपरिषद ने विचार नहीं किया हो तो राष्ट्रपति द्वारा अपेक्षा किये जाने पर उसे मंत्रिपरिषद के समक्ष विचार हेतु रखेगा।", "लार्ड मार्ले: समकक्षों में प्रथम।", "विलियम हारकॉर्ट: नक्षत्रों में चंद्रमा।", "संसदीय शासन में प्रधानमंत्री की सर्वाधिक महत्वपूर्ण तथा केंद्रीय भूमिका होती है तथा अन्य समस्त मंत्री उसके अधीन तथा नियंत्रण में होते हैं।", "नियंत्रण के माध्यम: 1. मंत्रियों की नियुक्ति राष्ट्रपति प्रधानमंत्री की सलाह से करता है। 2. विभागों का बंटवारा प्रधानमंत्री द्वारा। 3. आवश्यक होने पर विभागों में फेरबदल। 4. राष्ट्रपति के माध्यम से किसी मंत्री को पद से हटा सकता है। 5. विभिन्न विभागों में समन्वय। 6. मंत्रिमण्डल की बैठकों की अध्यक्षता। 7. राष्ट्रपति व मंत्रिपरिषद के बीच कड़ी। 8. प्रधानमंत्री की मृत्यु या त्यागपत्र से पूरी मंत्रिपरिषद बर्खास्त हो जाती है।"]], ["भारत के प्रधानमंत्री (1-7)", ["1. जवाहरलाल नेहरू (1947-64): प्रथम प्रधानमंत्री; सर्वाधिक लम्बी अवधि (लगभग 17 वर्ष); प्रथम विदेश मंत्री; भारतीय विदेश नीति के जनक, आदर्शवादी विदेश नीति। पंचशील समझौता - 29 अप्रैल 1954; गुटनिरपेक्ष आंदोलन - 1961; गोवा विजय - 1961; पांडिचेरी विलय - 1962; भारत-चीन युद्ध - 1962; पहली बार राष्ट्रीय आपातकाल - 26 अक्टूबर 1962; पद पर रहते मृत्यु वाले प्रथम प्रधानमंत्री।", "2. लाल बहादुर शास्त्री (1964-66): भारत-पाक युद्ध (1965); ताशकंद समझौता - 10 जनवरी 1966 (अयूब खान के साथ, सोवियत विदेश मंत्री कोसिजिन की मध्यस्थता); 11 जनवरी 1966 को ताशकंद में मृत्यु; पद पर रहते मृत्यु वाले दूसरे प्रधानमंत्री।", "Note: नेहरू और शास्त्री दोनों की मृत्यु के उपरांत गुलजारी लाल नंदा कार्यवाहक प्रधानमंत्री बनाए गए।", "3. इन्दिरा गांधी (1966-77): प्रथम महिला प्रधानमंत्री; राज्यसभा की सदस्या रही प्रथम प्रधानमंत्री; 14 बैंकों का राष्ट्रीयकरण - 1969; सोवियत संघ के साथ सैनिक संधि - 1971; भारत-पाक युद्ध 1971 (बांग्लादेश निर्माण); दूसरी बार राष्ट्रीय आपातकाल - 3 दिसम्बर 1971; शिमला समझौता - जुलाई 1972; प्रथम परमाणु परीक्षण - 18 मई 1974; आंतरिक अशांति के आधार पर आपातकाल - 25 जून 1975; पद पर रहते सांसद के रूप में अपना चुनाव हारने वाली प्रथम प्रधानमंत्री।", "4. मोरारजी देसाई (1977-79): प्रथम गैर कांग्रेसी प्रधानमंत्री; सबसे अधिक आयु में बनने वाले; किसी राज्य के मुख्यमंत्री रह चुके प्रथम प्रधानमंत्री; एक साथ दो उपप्रधानमंत्री (चौधरी चरण सिंह, जगजीवन राम); असली गुटनिरपेक्षता की नीति (अमेरिका के साथ संबंधों की शुरुआत); पद से त्यागपत्र देने वाले प्रथम प्रधानमंत्री।", "5. चौधरी चरण सिंह (1979-80): जिनकी नियुक्ति राष्ट्रपति ने स्वविवेक से की; एकमात्र प्रधानमंत्री जिन्होंने कभी लोकसभा का सामना नहीं किया।", "6. इन्दिरा गांधी (1980-84): दूसरा सबसे लम्बा कार्यकाल - 15 वर्ष; गुटनिरपेक्ष आंदोलन का 7वाँ शिखर सम्मेलन नई दिल्ली में - 1983; ऑपरेशन ब्लू स्टार (पंजाब में आतंकवाद का दमन); 31 अक्टूबर 1984 को गोली मारकर हत्या।", "7. राजीव गांधी (1984-89): सबसे कम आयु में बनने वाले (40 वर्ष); 1984-85 के लोकसभा चुनाव में कांग्रेस को 415 सीटें (किसी एक दल को सर्वाधिक सीटों का रिकार्ड); SAARC की स्थापना - दिसम्बर 1985; कोलम्बो समझौता 1987 (जयवर्धने के साथ, LTTE दमन हेतु सैन्य सहायता) जिसके तहत IPKF अभियान चलाया; 1991 में तमिलनाडु के पेरम्बदूर में चुनावी रैली में आत्मघाती हमले में मृत्यु।"]], ["भारत के प्रधानमंत्री (8-16)", ["8. विश्वनाथ प्रताप सिंह (1989-90): अन्तर्राज्यीय परिषद का गठन - 28 मई 1990; प्रथम प्रधानमंत्री जिनके विरुद्ध अविश्वास प्रस्ताव पारित हुआ।", "9. चन्द्रशेखर (1990-91)।", "10. पी.वी. नरसिम्हाराव (1991-96): आर्थिक उदारीकरण की नीति, वित्तमंत्री मनमोहन सिंह; पंचायती राज तथा नगरपालिकाओं को संवैधानिक दर्जा; नियुक्ति के समय संसद के किसी सदन के सदस्य नहीं थे।", "11. अटल बिहारी वाजपेयी (1996): एक कार्यकाल में सबसे कम अवधि तक रहने वाले प्रधानमंत्री।", "12. एच.डी. देवगौड़ा (1996-97): नियुक्ति के समय कर्नाटक के मुख्यमंत्री थे, बाद में राज्यसभा की सदस्यता ली; CTBT को अनुमति देने से इन्कार किया।", "13. इन्द्रकुमार गुजराल (1997-98)।", "14. अटल बिहारी वाजपेयी (1998-2004): 5 परमाणु परीक्षण (11-13 मई 1998); लाहौर बस यात्रा (1998); कारगिल संकट - 1999; आगरा शिखर वार्ता - 2001; संसद पर हमला - 13 दिसम्बर 2001; प्रधानमंत्री ग्राम सड़क योजना - 25 दिसम्बर 2000।", "15. मनमोहन सिंह (2004-14): RTI - 2005; नरेगा योजना - 2 फरवरी 2006; RTE - 2009; खाद्य सुरक्षा अधिनियम - 2013।", "16. नरेन्द्र मोदी (2014-निरन्तर): पहले पड़ोस की नीति (शपथ ग्रहण में पड़ोसी देशों के राष्ट्राध्यक्ष आमंत्रित); बांग्लादेश के साथ सीमा समझौता - 2015 (162 Enclave में से 111 बांग्लादेश को तथा 51 भारत की सीमा में; इसके लिए 100वाँ संविधान संशोधन); विमुद्रीकरण - 2016; GST - 101वाँ संविधान संशोधन 2016, 1 जुलाई 2017 से प्रभावी; अनु. 370 की समाप्ति।"]], ["पूर्व में CM रहे प्रधानमंत्री और उपप्रधानमंत्री", ["पूर्व में CM रहे: 1. मोरारजी देसाई (बंबई प्रांत)  2. चौधरी चरण सिंह (उत्तर प्रदेश)  3. वी.पी. सिंह (उत्तर प्रदेश)  4. पी.वी. नरसिम्हाराव (आन्ध्रप्रदेश)  5. एच.डी. देवगौड़ा (कर्नाटक)  6. नरेन्द्र मोदी (गुजरात)।", "उपप्रधानमंत्री: भारतीय संविधान में पद का कोई उल्लेख नहीं किया गया है, लेकिन समय-समय पर इस पद पर नियुक्तियाँ की जाती रही हैं। उपप्रधानमंत्री एक कैबिनेट मंत्री होता है।", "क्रम | उपप्रधानमंत्री | प्रधानमंत्री", "1. सरदार वल्लभभाई पटेल (1947-50) | जे.एल. नेहरू", "2. मोरारजी देसाई (1967-69) | इंदिरा गांधी", "3. चौधरी चरण सिंह तथा 4. जगजीवन राम (1979) | मोरारजी देसाई", "5. वाई.पी. चव्हाण (1979-80) | चौधरी चरण सिंह", "6. चौधरी देवीलाल (1989-90) | वी.पी. सिंह", "7. चौधरी देवीलाल (1990-91) | चन्द्रशेखर", "8. लाल कृष्ण आडवाणी (2002-04) | अटल बिहारी वाजपेयी"]]]], ["🏙️", "नगरीय स्वशासन", [["परिचय (74वाँ संशोधन 1992)", ["74वें संविधान संशोधन 1992 द्वारा भाग (IX क) जोड़कर उसके अंतर्गत 18 अनुच्छेद (243त-243यछ) जोड़े गए तथा नगरीय प्रशासन को संवैधानिक दर्जा प्रदान किया गया।", "इसी संशोधन द्वारा 12वीं अनुसूची जोड़ी गई, जिसमें 18 विषय शामिल किए गए।", "यह संविधान संशोधन 1 जून 1993 को लागू हुआ।", "अनु. 243त (P) परिभाषा | 243थ (Q) तीन स्तर | 243द (R) संरचना | 243ध (S) वार्ड समिति | 243न (T) आरक्षण | 243प (U) कार्यकाल | 243फ (V) योग्यताएँ | 243ब (W) शक्तियाँ | 243भ (X) वित्तीय शक्तियाँ | 243म (Y) राज्य वित्त आयोग | 243य (Z) लेखा संपरीक्षा | 243यक (ZA) राज्य निर्वाचन आयोग | 243यख (ZB) UT में लागू होना | 243यग (ZC) कुछ क्षेत्रों में लागू न होना | 243यघ (ZD) जिला आयोजना समिति | 243यङ (ZE) महानगरीय समिति | 243यच (ZF) पूर्व प्रचलित विधियों का बने रहना | 243यछ (ZG) न्यायालय के हस्तक्षेप का निषेध।"]], ["गठन और संरचना", ["गठन - तीन स्तर (अनु. 243थ): जनसंख्या के आधार पर तीन प्रकार के नगरीय निकाय: नगरपालिका 20,000 - 1 लाख | नगर परिषद 1 लाख - 5 लाख | नगर निगम 5 लाख से अधिक।", "संरचना (अनु. 243द): राज्य विधानमण्डल विधि द्वारा नगरीय निकायों की संरचना संबंधी प्रावधान निर्धारित कर सकती है।", "नगरीय निकायों का चुनाव (सदस्यों का) प्रादेशिक प्रतिनिधित्व के आधार पर प्रत्यक्ष निर्वाचन।", "प्रत्येक नगरपालिका को उतने ही वार्डों में समान जनसंख्या के आधार पर परिसीमन के माध्यम से विभाजित किया जायेगा, जितनी सदस्य संख्या होगी; अर्थात् प्रत्येक वार्ड से प्रत्यक्ष निर्वाचन के माध्यम से एक सदस्य चुना जायेगा।", "अध्यक्ष का निर्वाचन उस रीति से जैसा राज्य विधानमण्डल विधि द्वारा तय करें; उपाध्यक्ष का निर्वाचन - अप्रत्यक्ष।"]], ["वार्ड समितियाँ और आरक्षण", ["वार्ड समितियाँ (अनु. 243ध): राज्य विधानमण्डल ऐसे शहरों में इन समितियों का गठन कर सकता है, जहाँ की जनसंख्या 3 लाख से अधिक है। वार्ड समिति प्रत्येक वार्ड की अलग-अलग अथवा दो या अधिक वार्डों को मिलाकर बनाई जा सकती है।", "वार्ड समिति में उस वार्ड/उन वार्डों के गणमान्य सदस्यों को शामिल किया जायेगा; इनके चयन की रीति विधानमण्डल तय करेगा। इस समिति की अध्यक्षता - पार्षद। वार्ड समिति वार्ड/वार्डों के विकास योजना का निर्माण कर उसे प्रस्तुत करती है।", "आरक्षण (अनु. 243न): SC/ST/महिलाओं को आरक्षण। OBC - विधानमण्डल विधि द्वारा निर्धारण कर सकती है। SC/ST को आरक्षण उस राज्य की जनसंख्या के अनुपात में। महिलाओं को कम से कम 33% (1/3) आरक्षण।", "राजस्थान विधानसभा ने 2009 में अधिनियम पारित कर आरक्षण को 50% कर दिया।", "चक्रानुक्रम पद्धति से सीटों का निर्धारण।"]], ["कार्यकाल, योग्यता, शक्तियाँ", ["कार्यकाल (अनु. 243प): प्रथम बैठक से 5 वर्ष तक। आकस्मिक पद रिक्ति की दशा में 6 माह की अवधि में निर्वाचन आवश्यक; नव-निर्वाचित सदस्य शेष कार्यकाल के लिए पद ग्रहण करेगा।", "अविश्वास प्रस्ताव द्वारा अध्यक्ष को इस अवधि से पूर्व भी पद से हटाया जा सकता है; प्रक्रिया का निर्धारण विधानमण्डल विधि द्वारा करता है।", "योग्यता (अनु. 243फ): (1) भारत का नागरिक हो। (2) 21 वर्ष की आयु प्राप्त कर चुका हो। (3) वे समस्त योग्यताएँ जो विधानमण्डल तय करें।", "सामान्य शक्तियाँ (अनु. 243ब): नगरीय निकायों को 12वीं अनुसूची के 18 विषयों में से उन विषयों पर विधि बनाने, निर्णय लेने की शक्ति प्राप्त होगी, जो राज्य विधानमण्डल विधि द्वारा उन्हें सौंपे।", "वित्तीय शक्तियाँ / करारोपण (अनु. 243भ): नगरपालिकाओं द्वारा कर अधिरोपित करने की शक्ति और उनकी निधियाँ।"]], ["वित्त आयोग, लेखा, निर्वाचन आयोग", ["राज्य वित्त आयोग (अनु. 243म): नगरपालिकाओं को वित्तीय संसाधन उपलब्ध कराने की सिफारिश हेतु राज्यपाल प्रति 5 वर्ष से एक राज्य वित्त आयोग का गठन करेगा।", "लेखा संपरीक्षा (अनु. 243य): राज्य विधानमण्डल विधि द्वारा नगरपालिकाओं के लिए लेखा संपरीक्षा संबंधी प्रावधान कर सकेगा।", "राज्य निर्वाचन आयोग (अनु. 243यक): नगरपालिकाओं के निर्वाचन का संचालन, निर्देशन तथा परिवेक्षण हेतु प्रत्येक राज्य में एक राज्य निर्वाचन आयोग होगा। एक सदस्यीय - राज्य निर्वाचन आयुक्त; नियुक्ति - राज्यपाल; कार्यकाल - 5 वर्ष / 65 वर्ष की आयु; त्यागपत्र - राज्यपाल; पद से हटाना - राष्ट्रपति द्वारा संसद के समावेदन पर।", "संघ राज्य क्षेत्रों में लागू होना (अनु. 243यख): इस भाग के उपबंध संघ राज्य क्षेत्रों में लागू होंगे।", "कुछ क्षेत्रों में लागू न होना (अनु. 243यग): मणिपुर के पहाड़ी क्षेत्रों में; प. बंगाल के दार्जिलिंग जिले में; अनुसूचित एवं जनजाति क्षेत्रों में।"]], ["जिला आयोजना और महानगरीय समिति", ["जिला आयोजना समिति (अनु. 243यघ): जिले के सम्पूर्ण विकास हेतु ग्रामीण एवं नगरीय स्वशासन के बीच समन्वय के लिए प्रत्येक जिले में एक समिति; गठन की रीति राज्य विधानमण्डल तय करेगा। कुल सदस्य संख्या के 4/5 सदस्य जिला परिषद के सदस्यों तथा उस जिले के नगरीय निकायों के सदस्यों द्वारा, ग्रामीण एवं शहरी जनसंख्या के अनुपात में चुने जायेंगे।", "महानगरीय समिति (अनु. 243यङ): महानगरीय क्षेत्र के विकास हेतु योजना निर्माण के लिए, महानगर के बाहरी ग्रामीण क्षेत्रों के साथ समन्वय कर। कुल सदस्य संख्या के 2/3 सदस्य पंचायतों के अध्यक्षों तथा नगर निगम के सदस्यों द्वारा अपने में से ही, ग्रामीण एवं शहरी जनसंख्या के अनुपात में चुने जायेंगे।", "पूर्व प्रचलित विधियों का बने रहना (अनु. 243यच); न्यायालय के हस्तक्षेप का निषेध (अनु. 243यछ)।"]], ["तुलना: नगरपालिका, नगर परिषद, नगर निगम", ["विषय | नगरपालिका | नगर परिषद | नगर निगम", "जनसंख्या | 20,000 से 1 लाख | 1 लाख - 5 लाख | 5 लाख से अधिक", "सदस्य | पार्षद | पार्षद | पार्षद", "अध्यक्ष | चेयरमैन | सभापति | महापौर / मेयर", "उपाध्यक्ष | डिप्टी चेयरमैन | उपसभापति | उपमहापौर", "प्रशासनिक अधिकारी | अधिशाषी अधिकारी (EO) | नगर परिषद आयुक्त (RAS) | नगर निगम आयुक्त (IAS)"]]]], ["🏛️", "केंद्रीय मंत्रीपरिषद", [["अनु. 74", ["भारत में संसदीय शासन प्रणाली अपनाई गई है, अतः दो प्रकार की कार्यपालिका: राष्ट्रपति नाममात्र की कार्यपालिका, तथा प्रधानमंत्री के नेतृत्व में मंत्रीपरिषद वास्तविक कार्यपालिका।", "संविधान में मंत्रीपरिषद से संबंधित दो अनुच्छेदों (74 और 75) का उल्लेख है।", "अनु. 74(1): राष्ट्रपति को उसके कृत्यों में सहायता एवं परामर्श हेतु एक मंत्रीपरिषद होगी, जिसका प्रधान प्रधानमंत्री होगा।", "42वाँ संविधान संशोधन 1976: राष्ट्रपति ऐसे परामर्श के अनुसार ही कार्य करेगा।", "44वाँ संविधान संशोधन 1978: परन्तु राष्ट्रपति मंत्रीपरिषद से पुनर्विचार की अपेक्षा कर सकेगा तथा पुनर्विचार के उपरान्त दिए गए परामर्श के अनुसार कार्य करेगा।", "अनु. 74(2): इस प्रश्न की किसी भी न्यायालय में जाँच नहीं की जायेगी कि मंत्रीपरिषद ने राष्ट्रपति को सलाह दी अथवा नहीं, और यदि दी तो क्या सलाह दी। मंत्रीपरिषद द्वारा दी गई सलाह न्यायिक समीक्षा से परे होगी।"]], ["अनु. 75: नियुक्ति, पदच्युति, उत्तरदायित्व", ["अनु. 75(1) मंत्रियों की नियुक्ति: प्रधानमंत्री की नियुक्ति राष्ट्रपति करेगा तथा अन्य मंत्रियों की नियुक्ति राष्ट्रपति प्रधानमंत्री की सलाह से करेगा; अर्थात् मंत्रियों की नियुक्ति में राष्ट्रपति स्वविवेक का प्रयोग नहीं कर सकता।", "संविधान में मंत्रियों के लिए योग्यताओं का उल्लेख नहीं, लेकिन अपेक्षा की गई है कि मंत्री संसद का सदस्य हो। संसदीय प्रणाली में कार्यपालिका व्यवस्थापिका का ही एक हिस्सा होती है।", "अनु. 75(5): जो मंत्री निरन्तर 6 माह तक संसद के सदस्य नहीं होंगे, उस अवधि के उपरान्त मंत्री नहीं होंगे; अर्थात् नियुक्ति के समय सदस्य होना आवश्यक नहीं, पर 6 माह में किसी एक सदन का सदस्य होना आवश्यक।", "सर्वोच्च न्यायालय के निर्णयानुसार जो व्यक्ति सदस्य बने बिना 6 माह तक मंत्री रह चुका हो, वह उस सरकार के उस कार्यकाल में पुनः तब तक मंत्री नहीं बनाया जा सकता जब तक संसद की सदस्यता ग्रहण न कर ले।", "मंत्री की पदच्युति - अनु. 75(2): मंत्री राष्ट्रपति के प्रसादपर्यन्त पद पर रहेगा। प्रसादपर्यन्त का अर्थ है कि हटाने के लिए कारण बताने अथवा किसी प्रक्रिया की आवश्यकता नहीं। मंत्री व्यक्तिगत रूप से राष्ट्रपति के प्रति उत्तरदायी होता है (संविधान में 'व्यक्तिगत उत्तरदायित्व' शब्दावली का प्रयोग नहीं)। प्रसादपर्यन्त का व्यावहारिक अर्थ प्रधानमंत्री के प्रसादपर्यन्त होना है।", "अनु. 75(3) सामूहिक उत्तरदायित्व: मंत्रीपरिषद सामूहिक रूप से लोकसभा के प्रति उत्तरदायी होगी; जब तक उसे लोकसभा में बहुमत प्राप्त है तब तक अस्तित्व में रहेगी। अविश्वास प्रस्ताव पारित होने से मंत्रीपरिषद बर्खास्त हो जाती है। किसी एक मंत्री के विरुद्ध प्रस्ताव पारित होने पर पूरी मंत्रीपरिषद समाप्त हो जाती है: मंत्रीपरिषद साथ-साथ तैरती है और साथ-साथ डूबती है।", "अनु. 75(4) शपथ: मंत्री तीसरी अनुसूची में दिये गये प्रारूप के अनुरूप राष्ट्रपति के समक्ष पद एवं गोपनीयता की शपथ ग्रहण करते हैं।", "अनु. 75(6) वेतन-भत्ते: संसद द्वारा निर्धारित मात्रा में वेतन देय होगा।"]], ["संरचना, आकार और अन्य कैबिनेट", ["संविधान में मंत्रीपरिषद की संरचना का कोई उल्लेख नहीं है। मंत्रीपरिषद में मंत्री तीन प्रकार के होते हैं।", "मंत्रिमण्डल (केबिनेट): सर्वाधिक महत्वपूर्ण मंत्री, अपने विभाग के मुखिया तथा सर्वेसर्वा। मूल संविधान में 'मंत्रिमंडल' शब्द का प्रयोग नहीं था; 44वें संविधान संशोधन 1978 द्वारा अनु. 352 में इसका एक बार प्रयोग किया गया है। मंत्रिमण्डल की सामान्यतः सप्ताह में एक बार बैठक होती है जिसकी अध्यक्षता प्रधानमंत्री करता है।", "राज्यमंत्री: दूसरे स्तर के मंत्री, कैबिनेट मंत्री के अधीन रहकर सहायता करते हैं। जिस विभाग में कैबिनेट मंत्री नहीं होता उसका राज्यमंत्री 'स्वतंत्र प्रभार' का राज्यमंत्री कहलाता है।", "उपमंत्री: तीसरे स्तर के मंत्री, उपर्युक्त दोनों के अधीन रहकर कार्य करते हैं।", "संसदीय सचिव: मंत्रीपरिषद का हिस्सा नहीं होते, मंत्री नहीं होते, केवल सांसद होते हैं। नियुक्ति प्रधानमंत्री करता है तथा उसी के समक्ष शपथ ग्रहण करते हैं।", "अनु. 75(1)(क): मूल संविधान में मंत्रियों की अधिकतम संख्या निर्धारित नहीं थी। 91वें संशोधन 2003 द्वारा प्रावधान कि केन्द्रीय मंत्रीपरिषद में प्रधानमंत्री सहित मंत्रियों की अधिकतम संख्या लोकसभा की कुल सदस्य संख्या के 15% से अधिक नहीं होगी।", "अनु. 75(1)(ख) दलबदल: किसी मंत्री द्वारा दल-बदल किये जाने पर वह इस पद के अयोग्य होगा।", "किचन कैबिनेट: प्रधानमंत्री को राजनीतिक और प्रशासनिक दृष्टि से महत्वपूर्ण विषयों पर परामर्श तथा निर्णय लेने में सहायता प्रदान करता है। इसमें न केवल कैबिनेट मंत्री बल्कि प्रधानमंत्री के मित्र और परिवार के सदस्य भी शामिल होते हैं।", "छाया मंत्रिमंडल: विपक्ष में रहने वाली पार्टी भी अपना मंत्रिमंडल बनाती है और सदस्यों में विभागों का बंटवारा किया जाता है। छाया मंत्री का काम अपने विभाग से संबंधित सरकारी मंत्रालय की नीतियों और कामकाज की बारीक निगरानी, वैकल्पिक नीतियों को प्रस्तुत करना होता है।", "Note: लोकतंत्र में सत्ता पक्ष और विपक्ष दोनों का राज्य व्यवस्था में समान रूप से महत्वपूर्ण अंग होते हैं।"]]]], ["👨‍💼", "मुख्यमंत्री", [["नियुक्ति और स्थिति", ["नियुक्ति - अनु. 164(1): मुख्यमंत्री की नियुक्ति राज्यपाल करेगा; राज्यपाल बहुमत दल के नेता को मुख्यमंत्री नियुक्त करता है। किसी भी दल अथवा गठबंधन को विधानसभा में बहुमत न होने की स्थिति में राज्यपाल अपने स्वविवेक से ऐसे व्यक्ति को नियुक्त कर देता है।", "मुख्यमंत्री की योग्यताओं का संविधान में कोई उल्लेख नहीं है।", "अनु. 164(4): जो मंत्री निरन्तर 6 माह तक विधानसभा के सदस्य नहीं होंगे, इस अवधि के उपरांत मंत्री नहीं होंगे। यह प्रावधान मुख्यमंत्री पर भी लागू होता है; अर्थात् नियुक्ति के समय किसी सदन का सदस्य नहीं तो 6 माह में विधानमण्डल के किसी एक सदन की सदस्यता ग्रहण करना आवश्यक है।", "पद ग्रहण करते समय किसी भी सदन के सदस्य नहीं थे: (1) भैरोसिंह शेखावत - 1977 (2) जगन्नाथ पहाड़िया - 1980 (3) हरिदेव जोशी - 1989 (4) अशोक गहलोत - 1998।"]], ["कर्तव्य (अनु. 167) और मंत्रीपरिषद में स्थिति", ["अनु. 167: मुख्यमंत्री का कर्तव्य होगा कि (1) मंत्रीपरिषद के विधायी एवं प्रशासनिक निर्णयों की सूचना राज्यपाल को देगा। (2) राज्यपाल द्वारा किसी मामले पर चाही गयी सूचना उसे उपलब्ध करवायेगा। (3) यदि किसी मंत्री ने विनिश्चय कर लिया हो, लेकिन मंत्रीपरिषद ने विचार न किया हो तो राज्यपाल के आग्रह पर वह उस मामले को मंत्रीपरिषद के विचार हेतु प्रस्तुत करेगा।", "मंत्रीपरिषद में मुख्यमंत्री की स्थिति: (1) मंत्रियों की नियुक्ति में महत्वपूर्ण भूमिका। (2) मंत्रियों के बीच विभागों का बंटवारा करता है। (3) आवश्यक होने पर विभागों में फेरबदल कर सकता है। (4) राज्यपाल के माध्यम से किसी मंत्री को हटा सकता है। (5) पूरी मंत्रीपरिषद में समन्वय बनाये रखता है। (6) मंत्रिमण्डल की बैठकों की अध्यक्षता करता है। (7) मुख्यमंत्री की मृत्यु अथवा त्यागपत्र की स्थिति में पूरी मंत्रीपरिषद समाप्त हो जाती है।", "राज्य की मंत्रीपरिषद में मुख्यमंत्री की केन्द्रीय स्थिति होती है।"]], ["राजस्थान के मुख्यमंत्री", ["मनोनीत मुख्यमंत्री: (1) हीरालाल शास्त्री - 1949-51 (2) सी.एस. वेंकटाचारी - 1951 (3) जयनारायण व्यास - 1951-52।", "निर्वाचित: (1) टीकाराम पालीवाल - 1952, प्रथम निर्वाचित मुख्यमंत्री। (2) जयनारायण व्यास - 1952-54, एकमात्र मुख्यमंत्री जो मनोनीत तथा निर्वाचित (दोनों रूपों) में मुख्यमंत्री रहे। (3) मोहनलाल सुखाड़िया - 1954-71, सबसे लम्बी अवधि; राजस्थान में पहली बार राष्ट्रपति शासन लगा (1967)। (4) बरकतुल्ला खाँ - 1971-73, पद पर रहते देहांत (एकमात्र मुख्यमंत्री)। (5) हरिदेव जोशी - 1973-77, राज्य में दूसरी बार राष्ट्रपति शासन (1977)। (6) भैरोसिंह शेखावत - 1977-80, प्रथम गैर कांग्रेसी मुख्यमंत्री, तीसरी बार राष्ट्रपति शासन (1980)। (7) जगन्नाथ पहाड़िया - 1980-81। (8) शिवचरण माथुर - 1981-85। (9) हीरालाल देवपुरा - 1985 (केवल 16 दिन), सबसे कम अवधि। (10) हरिदेव जोशी - 1985-88। (11) शिवचरण माथुर - 1988-89। (12) भैरोसिंह शेखावत - 1990-92, चौथी बार राष्ट्रपति शासन (1992-93)। (13) भैरोसिंह शेखावत - 1993-98। (14) अशोक गहलोत - 1998-2003। (15) वसुंधरा राजे - 2003-08, प्रथम महिला मुख्यमंत्री। (16) अशोक गहलोत - 2008-13। (17) वसुंधरा राजे - 2013-18। (18) अशोक गहलोत - 2018 से निरन्तर।"]]]]]);
NOTES=NOTES.concat([["📜", "प्रस्तावना", [["प्रस्तावना का पाठ", ["हम भारत के लोग, भारत को एक सम्पूर्ण प्रभुत्व सम्पन्न, समाजवादी, पंथनिरपेक्ष, लोकतंत्रात्मक गणराज्य बनाने के लिए तथा उसके समस्त नागरिकों को: सामाजिक, आर्थिक और राजनैतिक न्याय, विचार, अभिव्यक्ति, विश्वास, धर्म और उपासना की स्वतंत्रता, प्रतिष्ठा और अवसर की समता प्राप्त कराने के लिए, तथा उन सब में व्यक्ति की गरिमा और राष्ट्र की एकता और अखण्डता सुनिश्चित करने वाली बंधुता बढ़ाने के लिए दृढ़ संकल्प होकर अपनी इस संविधान सभा में आज तारीख 26 नवम्बर, 1949 ई. को एतद्द्वारा इस संविधान को अंगीकृत, अधिनियमित और आत्मार्पित करते हैं।"]], ["प्रस्तावना के घटक", ["स्रोत: हम भारत के लोग।", "शासन का स्वरूप: सम्पूर्ण प्रभुत्व सम्पन्न, समाजवादी, पंथनिरपेक्ष, लोकतांत्रिक, गणराज्य।", "उद्देश्य/आदर्श: न्याय, स्वतंत्रता, समता, बन्धुता।", "तिथि: 26 नवम्बर 1949 ई.।", "प्रस्तावना का स्रोत/प्रेरणा: अमेरिका का संविधान।", "प्रस्तावना की भाषा: आस्ट्रेलिया के संविधान से प्रभावित है।", "जवाहरलाल नेहरू द्वारा 13 दिसम्बर 1946 को संविधान सभा में पेश किए उद्देश्य प्रस्ताव का प्रभाव स्पष्ट दिखाई देता है।", "संविधान सभा द्वारा प्रस्तावना को 17 अक्टूबर 1949 ई. को स्वीकृत किया गया।"]], ["विचारकों के कथन", ["के. एम. मुंशी: राजनीतिक जन्मकुण्डली", "नानी पालकीवाला: संविधान का परिचय पत्र", "एम. वी. पायली और ठाकुरदास भार्गव: संविधान की आत्मा", "अर्नेस्ट बार्कर ने 1950 में लिखी अपनी पुस्तक Principles of Social & Political Theory में शुरुआती पृष्ठों में भारतीय संविधान की पूरी प्रस्तावना को यह कहते हुए शामिल किया कि किसी नव-स्वतंत्र देश के संविधान की प्रस्तावना में इतने उच्च स्तर के लक्ष्य भी हो सकते हैं।"]], ["प्रस्तावना और न्यायालय", ["प्रस्तावना संविधान का भाग है या नहीं, यह लम्बे समय तक विवाद का विषय रहा।", "बेरुबारी वाद 1960: सर्वोच्च न्यायालय ने निर्णय दिया कि प्रस्तावना संविधान का भाग नहीं है।", "केशवानन्द भारती वाद 1973: सर्वोच्च न्यायालय ने अपने पूर्व निर्णय को बदलते हुए निर्णय दिया कि प्रस्तावना संविधान का एक महत्वपूर्ण भाग है।"]], ["संशोधन और शब्दावली", ["प्रस्तावना में अब तक केवल एक बार संशोधन किया गया है।", "42वाँ संविधान संशोधन 1976 द्वारा प की आवश्यकता नहीं होती।"]], ["निर्वाचन प्रणाली (अनु. 55)", ["राष्ट्रपति का निर्वाचन आनुपातिक प्रतिनिधित्व की एकल संक्रमणीय मत प्रणाली / एकल हस्तान्तरणीय मत प्रणाली / हेयर प्रणाली (Single Transferable Vote System) से होता है।", "इस प्रणाली में प्रत्याशियों को पसंद के आधार पर वरीयताएँ दी जाती हैं, अर्थात् जितने प्रत्याशी होते हैं मतदाता को मतपत्र में पसंद के आधार पर उतनी ही वरीयताएँ देनी होती हैं।", "राष्ट्रपति का निर्वाचन गुप्त मतदान से होता है।"]], ["मत गणना", ["राष्ट्रपति का निर्वाचन होने के बाद डाले गए कुल मतों में से अवैध मतों को निरस्त कर वैध मतों का एक न्यूनतम कोटा निकाला जाता है। चुनाव जीतने के लिए किसी प्रत्याशी को यह न्यूनतम कोटा प्राप्त करना आवश्यक है।", "न्यूनतम कोटा: (कुल डाले गए वैध मतों का योग ÷ (पदों की संख्या + 1)) + 1", "मतगणना के प्रथम चरण में पहली पसंद के आधार पर मतों की गणना की जाती है। किसी प्रत्याशी को न्यूनतम कोटा प्राप्त हो जाने पर उसे विजेता घोषित कर दिया जाता है।", "यदि किसी भी प्रत्याशी को न्यूनतम कोटा प्राप्त ना हो तो दूसरे चरण की मतगणना शुरू हो जाती है। इसमें सबसे कम मत प्राप्त करने वाले प्रत्याशी को पराजित घोषित कर दिया जाता है और उसके मतों को शेष प्रत्याशियों में अगली पसंद के आधार पर हस्तान्तरित कर दिया जाता है।", "यदि अब भी किसी प्रत्याशी को न्यूनतम कोटा प्राप्त ना हो तो यह प्रक्रिया तब तक चलती रहती है जब तक कि किसी एक प्रत्याशी को न्यूनतम कोटा प्राप्त ना हो जाए।", "Note: अब तक हुए राष्ट्रपति चुनाव में केवल एक बार 1969 के चुनाव में द्वितीय चरण की मतगणना की आवश्यकता हुई, जिसमें वी. वी. गिरि ने नीलम संजीव रेड्डी को पराजित किया।", "राष्ट्रपति के निर्वाचन से संबंधित किसी भी प्रकार के विवाद का निर्णय सर्वोच्च न्यायालय करेगा (अनु. 71(1))।", "राष्ट्रपति के निर्वाचक मण्डल में कोई स्थान रिक्त होने की दशा में राष्ट्रपति का चुनाव स्थगित नहीं होगा (अनु. 71(4)), अर्थात् किसी राज्य की विधानसभा भंग होने की दशा में भी राष्ट्रपति का चुनाव स्थगित नहीं होगा।"]], ["कार्यकाल, पुनर्निर्वाचन, पद की शर्तें", ["कार्यकाल (अनु. 56): राष्ट्रपति पद ग्रहण की तिथि से पाँच वर्ष की अवधि तक पद पर बना रहता है।", "उपराष्ट्रपति को सम्बोधित त्याग पत्र से वह इस अवधि से पूर्व (function(){for(var i=0;i<NOTES.length;i++)if(NOTES[i][1]==="राष्ट्रपति"){NOTES[i][2]=NOTES[i][2].concat([["शपथ और महाभियोग (अनु. 60-62)", ["राष्ट्रपति के वेतन तथा भत्तों में किसी प्रकार की कोई कटौती नहीं की जा सकती।", "शपथ (अनु. 60): राष्ट्रपति भारत के मुख्य न्यायाधीश अथवा उसकी अनुपस्थिति में वरिष्ठतम न्यायाधीश के समक्ष शपथ ग्रहण करेगा। राष्ट्रपति की शपथ के प्रारूप का उल्लेख तीसरी अनुसूची में नहीं है।", "महाभियोग (अनु. 61): संविधान में महाभियोग शब्द का प्रयोग केवल राष्ट्रपति के लिए किया गया है, अन्य किसी के लिए नहीं।", "ऐसा प्रस्ताव केवल एक कारण से लाया जा सकता है: संवैधानिक उल्लंघन अर्थात् संविधान का अतिक्रमण।", "ऐसा प्रस्ताव 14 दिन की पूर्व सूचना के 1/4 सदस्यों के समर्थन से संसद के किसी भी सदन में लाया जा सकता है।", "यह प्रस्ताव यदि पहले सदन में सदन की कुल सदस्य संख्या के 2/3 बहुमत से पारित हो जाए तो यह दूसरे सदन में जाता है।", "दूसरा सदन राष्ट्रपति पर लगे आरोपों की जाँच करता है। इस समय राष्ट्रपति को यह अधिकार है कि वह स्वयं उपस्थित होकर अथवा अपने प्रतिनिधि को भेजकर अपना पक्ष रख सकता है।", "जाँच में दोषी पाए जाने की दशा में यदि दूसरा सदन भी इस प्रस्ताव को अपने कुल सदस्य संख्या के 2/3 बहुमत से पारित कर दे तो राष्ट्रपति अपने पद से मुक्त हो जाता है।", "महाभियोग की यह प्रक्रिया अर्द्धन्यायिक प्रक्रिया है।", "आकस्मिक पद रिक्ति (अनु. 62): राष्ट्रपति का पद इन कारणों से रिक्त हो सकता है: (i) मृत्यु (ii) त्याग पत्र (iii) महाभियोग (iv) चुनाव अवैध घोषित होने की दशा में।", "राष्ट्रपति का पद आकस्मिक रूप से रिक्त होने की दशा में पद रिक्ति की तिथि से 6 माह की अवधि में राष्ट्रपति का निर्वाचन होना आवश्यक है। इस प्रकार से नव निर्वाचित राष्ट्रपति पूरे 5 वर्ष के लिए पद ग्रहण करता है।", "अनु. 65: राष्ट्रपति की पद रिक्ति अथवा अनुपस्थिति की दशा में उपराष्ट्रपति उसके पद के कर्तव्यों का निर्वहन करेगा। इस अवधि में उसे राष्ट्रपति के परिलाभ देय होंगे।", "अनु. 70: राष्ट्रपति और उपराष्ट्रपति दोनों की ही अनुपस्थिति अथवा पद रिक्ति की दशा में राष्ट्रपति पद के कर्तव्यों का निर्वहन कौन करेगा, इसका निर्धारण संसद विधि बनाकर करेगी।", "संसद ने इस संबंध में राष्ट्रपति कर्तव्य निर्वहन अधिनियम 1969 पारित ्ति जो इन तीनों बैठकों में उपस्थित थे: अटल बिहारी वाजपेयी।", "सांसदों की अयोग्यता से संबंधित विवाद का निर्णय (अनु. 103): राष्ट्रपति निर्वाचन आयोग की सलाह से करता है।", "कुछ विधेयकों को पेश किए जाने से पूर्व राष्ट्रपति की अनुमति आवश्यक: (1) धन विधेयक (2) वित्त विधेयक-I (3) नए राज्य के निर्माण से संबंधित विधेयक (4) किसी राज्य के नाम, सीमा अथवा क्षेत्र में परिवर्तन संबंधी विधेयक।", "Note: एक प्रकार के विधेयक को राज्य विधानमंडल में पेश किए जाने से पूर्व उस पर राष्ट्रपति की पूर्व अनुमति आवश्यक होती है: अन्तरराज्यीय व्यापार संबंधी विधेयक।", "संसद में कुछ सदस्यों का मनोनयन: राष्ट्रपति राज्यसभा में 12 ऐसे सदस्य मनोनीत करता है जिन्होंने साहित्य, विज्ञान, कला व समाजसेवा के क्षेत्र में कोई उल्लेखनीय कार्य किया है (अनु. 80)।", "लोकसभा (अनु. 331): राष्ट्रपति को यह समाधान हो कि लोकसभा में आंग्ल भारतीयों का पर्याप्त प्रतिनिधित्व नहीं है तो वह 2 आंग्ल भारतीय सदस्यों को मनोनीत कर सकता है। 104वें संविधान संशोधन द्वारा यह प्रावधान निरस्त हो गया है।", "संसद द्वारा पारित विधेयकों पर राष्ट्रपति की स्वीकृति (अनु. 111): साधारण विधेयक: स्वीकृत, अस्वीकृत, पुनर्विचार - तीनों संभव। धन विधेयक: स्वीकृत, अस्वीकृत संभव, पुनर्विचार नहीं। संविधान संशोधन विधेयक: केवल स्वीकृत।", "24वें संविधान संशोधन 1971 द्वारा 368 में संशोधन कर यह प्रावधान कर दिया गया कि संविधान संशोधन विधेयक पर राष्ट्रपति अपनी स्वीकृति नहीं रोकेगा।", "राज्य विधानमंडल द्वारा पारित विधेयकों पर राष्ट्रपति की स्वीकृति (अनु. 201): राज्यपाल द्वारा राष्ट्रपति के विचारार्थ सुरक्षित रखे गए विधेयक को राष्ट्रपति स्वीकृत कर सकता है, अस्वीकृत कर सकता है अथवा पुनर्विचार के लिए लौटा सकता है।", "राष्ट्रपति द्वारा पुनर्विचार के लिए लौटाए गए इस विधेयक को यदि राज्य विधानमंडल पुनः पारित कर दे तो राष्ट्रपति इस विधेयक को स्वीकृति देने के लिए बाध्य नहीं है।", "Note: उच्च न्यायालय की शक्तियों से संबंधित विधेयक ऐसे हैं जिन पर राष्ट्रपति की स्वीकृति के लिए भेजने में राज्यपाल बाध्य है।"]], ["वीटो शक्ति (निषेधाधिकार)", ["संसद द्वारा पारित किसी विधेयक को कानून बनने से रोकना निषेधाधिकार कहलाता है। संविधान में वीटो शब्द का प्रयोग कहीं नहीं किया गया है।", "अनु. 111 में दी गई राष्ट्रपति शक्तियों को हमने वीटो शक्ति का नाम देकर तीन भाग बना लिए हैं:", "आत्यंतिक वीटो: संसद द्वारा पारित किसी विधेयक को राष्ट्रपति द्वारा अस्वीकृत कर देना। 1954 में राजेन्द्र प्रसाद ने PEPSU विनियोग विधेयक पर इस वीटो का प्रयोग किया था। इस वीटो का प्रयोग प्रधानमंत्री की सलाह से करता है।", "निलम्बनकारी वीटो: संसद द्वारा पारित होकर आए किसी साधारण विधेयक को राष्ट्रपति द्वारा पुनर्विचार के लिए लौटाना। यदि संसद के दोनों सदन इस विधेयक को साधारण बहुमत से पुनः पारित कर लौटा दें तो राष्ट्रपति इसे स्वीकृति देने हेतु बाध्य है।", "Note: भारत के राष्ट्रपति के निलम्बनकारी वीटो की भाँति अमेरिका के राष्ट्रपति के पास इसके समकक्ष विरोधित वीटो होता है। अमेरिका में कांग्रेस के दोनों सदनों के विशेष बहुमत से पुनः पारित किए जाने की आवश्यकता होती है।", "पॉकेट वीटो: अनु. 111 के अनुसार संसद द्वारा पारित किसी विधेयक पर राष्ट्रपति यथाशीघ्र स्वीकृति देगा, अथवा स्वीकृति रोकेगा, अथवा पुनर्विचार के लिए लौटाएगा। समय सीमा कोई निर्धारित नहीं की गई है।", "अतः यदि किसी विधेयक पर राष्ट्रपति ना तो स्वीकृति दे, ना स्वीकृति रोके अथवा ना ही उसे पुनर्विचार के लिए लौटाए, अर्थात् कोई प्रतिक्रिया नहीं करना ही पॉकेट वीटो कहलाता है।", "1986 में डाकघर संशोधन विधेयक पर राष्ट्रपति ज्ञानी जैल सिंह ने इस वीटो का प्रयोग किया था।", "Note: राज्य विधानमंडल द्वारा पारित विधेयक जब राज्यपाल की सहमति से राष्ट्रपति के विचारार्थ भेजा जाता है तो राष्ट्रपति उस पर आत्यंतिक वीटो, निलम्बनकारी वीटो तथा पॉकेट वीटो का प्रयोग कर सकता है।"]], ["अध्यादेश (अनु. 123)", ["जब संसद का सत्र नहीं चल रहा हो तब किसी कानून की आवश्यकता होने की दशा में राष्ट्रपति संघ सूची तथा समवर्ती सूची के विषय पर अध्यादेश कर सकता है।", "राष्ट्रपति द्वारा जारी ऐसे अध्यादेश की न्यायिक समीक्षा की जा सकती है।", "ऐसा अध्यादेश राष्ट्रपति द्वारा किसी भी समय वापस लिया जा सकता है।", "ऐसा अध्यादेश नए सत्र के शुरू होने से 6 सप्ताह की अवधि तक प्रभावी रहता है। संसद इस अवधि से पूर्व भी इसे समाप्त कर सकती है।", "कोई अध्यादेश अधिकतम 6 माह तथा 6 सप्ताह की अवधि तक जारी रह सकता है।"]], ["न्यायिक शक्तियाँ", ["सर्वोच्च न्यायालय से सलाह लेना (अनु. 143): किसी मामले पर राष केन्द्र और राज्यों के बीच वित्त वितरण संबंधी प्रावधान करता है (अनु. 280)।", "राजनयिक शक्तियाँ: राष्ट्रपति विदेशों में भारत के राजदूतों की नियुक्ति करता है। राष्ट्रपति विदेशी राजदूतों को भारत में काम करने की अनुमति प्रदान करता है। विदेशों से की जाने वाली संधियाँ राष्ट्रपति के नाम से ही की जाती हैं। राष्ट्रपति विदेशों में भारत का प्रतिनिधित्व करता है।", "सैन्य शक्ति: राष्ट्रपति भारत के रक्षा बलों का सर्वोच्च समादेश है, जिसे संसद द्वारा विधि बनाकर विनियमित किया जा सकता है (अनु. 53)।"]], ["राष्ट्रीय आपातकाल (अनु. 352)", ["भाग XVIII | अनु. 352-360 | राष्ट्रपति की आपातकाल शक्तियाँ।", "अनु. 352: युद्ध, बाह्य आक्रमण अथवा सशस्त्र विद्रोह की दशा में आपातकाल। आम बोलचाल की भाषा में इसे राष्ट्रीय आपातकाल कहा जाता है, हालांकि इस शब्द का प्रयोग संविधान में कहीं नहीं किया गया है।", "उद्घोषणा: यदि राष्ट्रपति को यह लगे कि युद्ध, बाह्य आक्रमण अथवा सशस्त्र विद्रोह के कारण देश की राष्ट्रीय सुरक्षा संकट में है तो वह अनु. 352 के तहत राष्ट्रीय आपातकाल की उद्घोषणा कर सकता है।", "ऐसी उद्घोषणा की न्यायिक समीक्षा की जा सकती है। ऐसी उद्घोषणा आशंका के आधार पर भी की जा सकती है। ऐसी उद्घोषणा पूरे देश में भी प्रभावी की जा सकती है अथवा केवल प्रभावित क्षेत्र में भी लागू की जा सकती है।", "44वें संविधान संशोधन 1978 द्वारा इस उद्घोषणा में संशोधन: (i) आन्तरिक अशांति शब्द को समाप्त कर सशस्त्र विद्रोह कर दिया गया। (ii) ऐसी उद्घोषणा मंत्रीमण्डल (कैबिनेट) के परामर्श के आधार पर की जा सकती है। (iii) मूल संविधान में संसद के अनुमोदन के बिना यह आपातकाल 2 माह की अवधि तक प्रभावी रहने का प्रावधान था। (iv) 44वें संशोधन द्वारा इस 2 माह के प्रावधान को घटाकर 1 माह कर दिया गया।", "संसद द्वारा अनुमोदन: उद्घोषणा की तिथि से 1 माह की अवधि में यदि संसद के दोनों सदन इसे विशेष बहुमत से अनुमोदित कर दें तो यह आपातकाल अनुमोदन तिथि से 6 माह की अवधि तक बढ़ जाता है। 6 माह की अवधि समाप्त होने से पूर्व संसद द्वारा विशेष बहुमत से इसे पुनः अनुमोदित कर दिए जाने पर यह आपातकाल पुनः 6 माह बढ़ जाता है। इस प्रकार प्रति 6 माह से संसद के अनुमोदन से इस आपातकाल को अनिश्चित काल तक जारी रखा जा सकता है।", "मूल संविधान में इस आपातकाल हेतु संसद के साधारण बहुमत का प्रावधान था। 44वें संशोधन द्वारा इस साधारण बहुमत को बदलकर विशेष बहुमत कर दिया गया।", "इस आपातकाल को अनुमोदित किए जाने से पहले ही लोकसभा के भंग हो जाने की दशा में केवल राज्यसभा द्वारा इसे अनुमोदित किए जाने पर यह 6 माह की अवधि तक बढ़ जाती है। लेकिन यह जरूरी है कि नई लोकसभा अपनी पहली बैठक से एक माह की अवधि में इसे अनुमोदित करे।", "समाप्ति: (i) राष्ट्रपति द्वारा इसे समाप्त किए जाने की घोषणा से। (ii) संसद द्वारा इसे अनुमोदित न किए जाने पर। (iii) 44वें संविधान संशोधन 1978 द्वारा इस आपातकाल को समाप्त करने की विशेष शक्ति लोकसभा को प्रदत्त की गई जिसके तहत 1/10 सदस्यों की माँग पर राष्ट्रपति द्वारा (यदि सत्र चल रहा है तो लोकसभा अध्यक्ष द्वारा) बुलाई गई विशेष बैठक में यदि लोकसभा इसे समाप्त किए जाने के प्रस्ताव को साधारण बहुमत से पारित कर दे तो यह आपातकाल समाप्त हो जाता है।", "प्रभाव: कार्यपालिका संबंधी प्रभाव (अनु. 353): इस आपातकाल की दशा में राज्य अपनी कार्यपालिका शक्ति का प्रयोग केन्द्र के निर्देशानुसार करती है। अर्थात् राज्य सरकारें समाप्त नहीं होती लेकिन शक्तिहीन हो जाती हैं।", "विधायी प्रभाव (अनु. 353): इस आपातकाल की दशा में राज्य सूची पर राज्य विधानमण्डलों का एकाधिकार समाप्त हो जाता है। राज्य सूची के किसी विषय पर संसद द्वारा विधि निर्माण किया जा सकता है तथा संसद द्वारा बनाई गई ऐसी विधियाँ आपातकाल की समाप्ति के 6 माह बाद तक प्रभावी रहती हैं (अनु. 250)। इस आपातकाल में लोकसभा का कार्यकाल बढ़ाया जा सकता है लेकिन एक बार में एक वर्ष से अधिक नहीं बढ़ाया जा सकता।", "वित्तीय प्रभाव (अनु. 354): इस आपातकाल की दशा में केन्द्र और राज्यों के बीच वित्तीय वितरण संबंधी प्रावधानों में आवश्यक परिवर्तन किया जा सकता है।", "मौलिक अधिकारों पर प्रभाव (अनु. 358 व 359): मौलिक अधिकारों का निलंबन राष्ट्रीय आपातकाल (अनु. 352) की दशा में होता है, राष्ट्रपति शासन तथा वित्तीय आपातकाल की दशा में नहीं।", "अनु. 358: अनुच्छेद 358 का संबंध अनु. 19 के निलम्बन से है। 44वें संशोधन 1978 द्वारा यह प्रावधान किया गया कि अनुच्छेद 358 केवल युद्ध अथवा बाह्य आक्रमण के कारण घोषित आपातकाल में ही प्रभावी होगा, सशस्त्र विद्रोह के कारण घोषित आपातकाल में नहीं। ऐसी दशा में लागू आपातकाल की स्थिति में अनु. 19 स्वतः निलम्बित हो जाता है।", "अनु. 359: जहाँ अनु. 358 का संबंध केवल अनु. 19 के निलम्बन से है, वहीं अनु. 359 का संबंध भाग-3 में दिए गए मौलिक अधिकारों के निलम्बन से है। अनु. 359 युद्ध, बाह्य आक्रमण अथवा सशस्त्र विद्रोह तीनों में से किसी भी दशा में घोषित आपातकाल की स्थिति में प्रभावी हो सकता है।", "जहाँ अनु. 358 के तहत अनु. 19 स्वतः निलम्बित होता है, वहीं अनु. 359 के तहत मौलिक अधिकार तब निलम्बित होंगे जब राष्ट्रपति ऐसा कोई आदेश जारी करे तथा इसके तहत केवल वे मौलिक अधिकार निलम्बित होंगे जिनका राष्ट्रपति के आदेश में उल्लेख होगा।", "44वें संविधान संशोधन 1978 द्वारा अनु. 359 में यह प्रावधान कर दिया गया कि अनु. 20 तथा अनु. 21 को किसी भी दशा में निलम्बित नहीं किया जा सकता।", "प्रयोग: (1) भारत-चीन युद्ध: उद्घोषणा 26 अक्टूबर 1962, समाप्त 10 जनवरी 1968; राष्ट्रपति सर्वपल्ली राधाकृष्णन; P.M. जवाहरलाल नेहरू।", "(2) भारत-पाक युद्ध (बांग्लादेश): उद्घोषणा 3 दिसम्बर 1971, समाप्त 21 मार्च 1977; राष्ट्रपति वी. वी. गिरि; P.M. इन्दिरा गांधी।", "(3) आन्तरिक अशांति: उद्घोषणा 25 जून 1975, समाप्त 21 मार्च 1977; राष्ट्रपति फखरुद्दीन अली अहमद; P.M. इन्दिरा गांधी।"]], ["राष्ट्रपति शासन (अनु. 356)", ["किसी राज्य का संवैधानिक तंत्र विफल होने की दशा में अनुच्छेद 356 के तहत आम बोलचाल की भाषा में इसे राष्ट्रपति शासन कहा जाता है।", "उद्घोषणा: राज्यपाल के प्रतिवेदन अथवा अन्य किसी माध्यम से यदि राष्ट्रपति को यह समाधान हो कि किसी राज्य का संवैधानिक तंत्र विफल हो चुका है अर्थात् उस राज्य का शासन संविधान के अनुसार नहीं चलाया जा रहा तो वह उस राज्य में अनु. 356 तहत राष्ट्रपति शासन की उद्घोषणा कर सकता है।", "अनु. 356 का प्रयोग अनु. 365 के आधार पर भी किया जा सकता है। अनु. 365: यदि कोई राज्य केन्द्र के निर्देशों की अनुपालना ना करे तो यह माना जायेगा कि उस समय राज्य का संवैधानिक तंत्र विफल हो चुका है।", "अनु. 355: संघ का यह कर्तव्य होगा कि वह बाह्य आक्रमण तथा आंतरिक अशांति से प्रत्येक राज्य को सुरक्षा प्रदान करे तथा प्रत्येक राज्य का शासन संविधान के अनुरूप चलाया जाना सुनिश्चित करे।", "अनु. 356 का प्रयोग आशंका के आधार पर नहीं किया जा सकता बल्कि वास्तविक तथ्यों के आधार पर ही किया जा सकता है। इस उद्घोषणा की न्यायिक समीक्ष  if(/^Note/.test(l))return '<div class="nn"><b>Note</b>'+hl(l.replace(/^Note\s*:?\s*/,''))+'</div>';
 var p=l.split(' | ');
 if(p.length===2||p.length===4)return '<div class="tg" style="grid-template-columns:repeat('+p.length+',1fr)">'+p.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>';
 if(p.length===3)return '<div class="tb"><span class="c1">'+p[0]+'</span><span class="c2">'+p[1]+'</span><span class="c3">'+p[2]+'</span></div>';
 var m=l.match(/^([^:।]{2,48}):\s(.+)$/);
 if(m&&!/^\d/.test(m[1]))return '<p class="nl"><span class="ar">➜</span><b class="kw">'+m[1]+':</b> '+hl(m[2])+'</p>';
 return '<p class="nl"><span class="ar">➜</span>'+hl(l)+'</p>'}
function hl(t){return t.replace(/(अनु\.\s?\d[\d\-–]*(?:\([^)]*\))?\s?[कखगघ]?)/g,'<mark>$1</mark>').replace(/\b(1[89]\d\d|20[0-3]\d)\b/g,'<b class="yr">$1</b>')}
