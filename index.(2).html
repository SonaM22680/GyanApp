// English translations (हिंदी सवालों के क्रम में): 'English question|opt1;opt2;opt3;opt4'. नए अनुवाद इसी सूची के अंत में जोड़ें
var ENX=["When was the Battle of Plassey fought?|1757;1764;1857;1526|In 1757 Robert Clive defeated Bengal's Nawab Siraj-ud-Daulah. This laid the foundation of British rule in India.", "When was the First Battle of Panipat fought?|1526;1556;1761;1530|In 1526 Babur defeated Ibrahim Lodi and founded the Mughal dynasty.", "Between whom was the Second Battle of Panipat fought?|Akbar and Hemu;Babur and Rana Sanga;Ahmad Shah Abdali and the Marathas;Sher Shah and Humayun|In 1556 Akbar (with Bairam Khan's help) defeated Hemu. The Third Battle (1761) was between Abdali and the Marathas.", "Who founded the Maurya dynasty?|Chandragupta Maurya;Ashoka;Bindusara;Dhanananda|With Chanakya (Kautilya)'s help, Chandragupta defeated the Nanda dynasty around 322 BCE and founded the Maurya dynasty.", "When did Ashoka fight the Kalinga war?|261 BCE;321 BCE;185 BCE;232 BCE|After the massive bloodshed of the Kalinga war, Ashoka gave up violence and adopted Buddhism.", "Which period is called the Golden Age of India?|Gupta period;Maurya period;Mughal period;Chola period|The Gupta period saw great progress in science, mathematics, art and literature. Aryabhata and Kalidasa belong to this era.", "Who is called the \"Napoleon of India\"?|Samudragupta;Chandragupta II;Ashoka;Harshavardhana|Samudragupta won many wars and never lost. Historian V.A. Smith gave him this title. The Prayag Prashasti describes his conquests.", "Who is credited with discovering Harappa (1921)?|Daya Ram Sahni;R.D. Banerjee;John Marshall;Mortimer Wheeler|Daya Ram Sahni excavated Harappa in 1921 and R.D. Banerjee Mohenjo-daro in 1922. John Marshall was then head of the ASI.", "What does \"Mohenjo-daro\" mean?|Mound of the dead;Golden city;River bank;Sacred city|It lies on the Indus river in Sindh (now Pakistan). Its Great Bath is famous.", "When did Alexander invade India?|326 BCE;261 BCE;321 BCE;185 BCE|In 326 BCE he fought King Porus on the banks of the Jhelum (Hydaspes).", "Who was the 24th Tirthankara of Jainism?|Mahavira Swami;Parshvanath;Rishabhdev;Neminath|Rishabhdev was the first Tirthankara and Parshvanath the 23rd. Mahavira was born in Kundagrama near Vaishali.", "Who founded the Slave dynasty of the Delhi Sultanate?|Qutb-ud-din Aibak;Iltutmish;Balban;Razia Sultan|Aibak began the Slave dynasty in 1206. He started building the Qutub Minar and Iltutmish completed it.", "Who introduced the rupee coin?|Sher Shah Suri;Akbar;Alauddin Khalji;Muhammad Tughlaq|Sher Shah issued the silver rupee. He also built the Grand Trunk Road and improved the postal system.", "When was the Battle of Haldighati fought?|1576;1526;1556;1605|The battle was between Akbar's army (led by Man Singh) and Maharana Pratap.", "When was the Battle of Buxar fought?|1764;1757;1761;1857|The British defeated the combined army of Mir Qasim, Shuja-ud-Daula and Shah Alam II. In 1765 they then received the Diwani of Bengal.", "When was Shivaji crowned?|1674;1664;1680;1707|In 1674 he received the title \"Chhatrapati\" at Raigad.", "Who built the Taj Mahal?|Shah Jahan;Akbar;Jahangir;Aurangzeb|Shah Jahan built it at Agra in memory of his wife Mumtaz Mahal. Ustad Ahmad Lahori is believed to be its architect.", "Who founded the Vijayanagara Empire?|Harihara and Bukka;Krishnadevaraya;Deva Raya II;Tirumala|Harihara and Bukka of the Sangama dynasty founded it in 1336. Krishnadevaraya was its most famous ruler.", "Who introduced the Subsidiary Alliance?|Lord Wellesley;Lord Dalhousie;Robert Clive;Lord Curzon|Wellesley (1798–1805) made treaties with Indian rulers in exchange for protection by British troops. The Nizam of Hyderabad was the first state to accept it.", "Who implemented the \"Doctrine of Lapse\"?|Lord Dalhousie;Lord Wellesley;Lord Curzon;Lord Ripon|Under it, an adopted son could not inherit the throne. Satara, Jhansi and Nagpur were annexed this way.", "Sati was banned during whose rule?|Lord William Bentinck;Lord Cornwallis;Warren Hastings;Lord Dalhousie|Bentinck passed the law in 1829. Raja Ram Mohan Roy played a major role.", "Where did the 1857 revolt begin?|Meerut;Delhi;Jhansi;Kanpur|On 10 May 1857 sepoys revolted at Meerut, then marched to Delhi and declared Bahadur Shah Zafar their leader.", "When was the Indian National Congress founded?|1885;1857;1905;1919|It was founded by A.O. Hume and its first president was W.C. Bonnerjee.", "Which viceroy partitioned Bengal?|Lord Curzon;Lord Dalhousie;Lord Ripon;Lord Minto|The partition took place in 1905 and led to the Swadeshi Movement. It was annulled in 1911.", "When did the Jallianwala Bagh massacre happen?|1919;1920;1922;1930|On 13 April 1919 General Dyer ordered firing at Amritsar. Tagore returned his knighthood in protest.", "When did the Non-Cooperation Movement begin?|1920;1919;1930;1942|Gandhiji started it. He withdrew it in 1922 after the violence at Chauri Chaura.", "When was the Dandi March?|1930;1920;1931;1942|On 12 March 1930 Gandhiji walked from Sabarmati to Dandi to break the salt law. It marked the start of the Civil Disobedience Movement.", "When did the Quit India Movement begin?|1942;1930;1920;1945|On 8 August 1942 the slogan \"Do or Die\" was given in Bombay.", "Who led the Indian National Army (Azad Hind Fauj)?|Subhas Chandra Bose;Rash Behari Bose;Bhagat Singh;Chandrashekhar Azad|Rash Behari Bose laid its foundation and Subhas Chandra Bose took command in Singapore in 1943. The slogan was \"Delhi Chalo\".", "Who was the last Viceroy of India?|Lord Mountbatten;Lord Linlithgow;Lord Wavell;Lord Curzon|Mountbatten also became independent India's first Governor-General.", "When did World War I begin?|1914;1918;1939;1905|It began with the assassination of Austrian Archduke Franz Ferdinand in 1914 and ended in 1918.", "When did the French Revolution occur?|1789;1776;1815;1848|Its slogan was \"Liberty, Equality, Fraternity\". It is considered to have begun with the storming of the Bastille.", "Who built the Brihadeshwara Temple (Thanjavur)?|Rajaraja Chola I;Rajendra Chola;Pulakeshin II;Narasimhavarman|It is a supreme example of Chola architecture and a UNESCO World Heritage Site.", "What was the main port city of the Indus Civilization?|Lothal;Harappa;Kalibangan;Ropar|A dockyard (ship dock) has been found at Lothal in Gujarat.", "How many mandalas are there in the Rigveda?|10;8;12;4|The Rigveda has 10 mandalas and 1028 hymns.", "In which mandala of the Rigveda is the Gayatri Mantra?|Third;First;Eighth;Tenth|It is in the third mandala, whose composer is believed to be Vishwamitra.", "How many Mahajanapadas were there in ancient India?|16;10;12;18|The Buddhist text Anguttara Nikaya lists 16 Mahajanapadas.", "Where did Gautama Buddha attain enlightenment?|Bodh Gaya;Sarnath;Kushinagar;Lumbini|He attained enlightenment under a peepal tree at Bodh Gaya. He gave his first sermon at Sarnath and attained Mahaparinirvana at Kushinagar.", "In which script are Ashoka's inscriptions mainly written?|Brahmi;Kharosthi;Devanagari;Tamil|Most are in Brahmi. James Prinsep deciphered them in 1837.", "Who is the author of the \"Arthashastra\"?|Kautilya (Chanakya);Kalidasa;Vishakhadatta;Banabhatta|It is an ancient treatise on politics, economy and governance.", "Who wrote \"Indica\"?|Megasthenes;Fa-Hien;Hiuen Tsang;Al-Biruni|Megasthenes was a Greek ambassador at the court of Chandragupta Maurya.", "Which dynasty did Kanishka belong to?|Kushan;Shaka;Satavahana;Gupta|The Fourth Buddhist Council was held in his time, and he is believed to have started the Shaka era in 78 CE.", "Which is India's national calendar?|Shaka Samvat;Vikram Samvat;Hijri;Gupta Samvat|The Shaka era is believed to begin in 78 CE and has been officially adopted.", "During whose reign did the Chinese traveller Hiuen Tsang visit India?|Harshavardhana;Chandragupta II;Ashoka;Kanishka|He studied at Nalanda and wrote the book \"Si-Yu-Ki\".", "During whose reign did the Chinese traveller Fa-Hien visit India?|Chandragupta II;Harshavardhana;Ashoka;Skandagupta|Fa-Hien visited India between 399 and 414 CE.", "Who wrote \"Abhijnanashakuntalam\"?|Kalidasa;Bhasa;Bhavabhuti;Shudraka|Kalidasa was a great poet of the Gupta period. Meghaduta is also his work.", "Whom did Pulakeshin II defeat on the banks of the Narmada?|Harshavardhana;Narasimhavarman;Dharmapala;Mihirabhoja|This is a famous victory of the Chalukya king Pulakeshin II, described in the Aihole inscription.", "When did Mahmud of Ghazni attack the Somnath temple?|1025 CE;1001 CE;1192 CE;1206 CE|He invaded India 17 times in total.", "When was the Second Battle of Tarain fought?|1192;1191;1206;1526|Muhammad Ghori defeated Prithviraj Chauhan in it. Prithviraj had won the first battle in 1191.", "Who implemented the market control (price control) policy?|Alauddin Khalji;Balban;Muhammad Tughlaq;Firoz Tughlaq|He fixed commodity prices to supply cheap goods to the army.", "Who wrote \"Tarikh-i-Firozshahi\"?|Ziauddin Barani;Amir Khusrau;Ibn Battuta;Minhaj-us-Siraj|Barani was a leading historian of the Sultanate period.", "Which country was the traveller Ibn Battuta from?|Morocco;China;Iran;Uzbekistan|He came during Muhammad bin Tughlaq's time. His book is the \"Rihla\".", "When was the Battle of Khanwa fought?|1527;1526;1528;1530|Babur defeated Rana Sanga in it.", "When did Sher Shah Suri decisively defeat Humayun?|1540 (Kannauj/Bilgram);1526;1556;1764|After defeats at Chausa (1539) and then Kannauj (1540), Humayun had to leave India.", "Who developed the \"Zabti\" land revenue system?|Raja
